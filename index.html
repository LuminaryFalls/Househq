document.addEventListener('input',async e=>{
  const el=e.target, a=el.dataset.act;
  if(el.id==='q'){ q=el.value; const p=el.selectionStart; render();
    const n=document.getElementById('q'); if(n){n.focus();n.setSelectionRange(p,p);} return; }
  if(el.dataset.m && modal){
    if(modal.draft){
      modal.draft[el.dataset.m]=el.value;
      if(el.dataset.m==='season'){ if(!seasonMonths(el.value).includes(+modal.draft.month)) modal.draft.month=0; commitDraft(); render(); return; }
      commitDraft();
    } else modal[el.dataset.m]=el.value;
    return; }
  if(!a) return;
  if(a==='who'){ LS('hq:who',el.value.trim()||null); return; }
  if(a==='pname'){ S.propertyName=el.value; document.getElementById('hname').textContent=el.value||'House HQ'; saveSoon(); return; }
  if(a==='spec'){ const s=S.specs.find(x=>x.id===el.dataset.sid); if(s){ s[el.dataset.f]=el.value; saveSoon(); } return; }
  if(a==='eq'){ const q2=S.equipment.find(x=>x.id===el.dataset.id); if(q2){ q2[el.dataset.f]=el.value; saveSoon(); } return; }
  if(a==='espec'){ const q2=S.equipment.find(x=>x.id===el.dataset.id), sp=q2&&q2.specs.find(x=>x.id===el.dataset.sid);
    if(sp){ sp[el.dataset.f]=el.value; saveSoon(); } return; }
  if(a==='echk'){ const q2=S.equipment.find(x=>x.id===el.dataset.id), ck=q2&&q2.checks.find(x=>x.id===el.dataset.cid);
    if(ck){ ck[el.dataset.f]=el.value; saveSoon(); } return; }
  if(a==='caption'||a==='where'||a==='pnote'){ const p=S.photos.find(x=>x.id===el.dataset.id);
    if(p){ p[a==='caption'?'caption':a==='where'?'where':'note']=el.value; saveSoon(); } return; }
  if(a==='precheck'){ const p=S.photos.find(x=>x.id===el.dataset.id); if(!p) return;
    const n=+el.value||0; p.recheckEvery=n;
    p.recheck=n?isoOf(addMonths(today0(),n)):'';
    save(); render(); return; }
});

document.addEventListener('click',async e=>{
  const btn=e.target.closest('[data-act]');
  if(!btn) return;
  const a=btn.dataset.act, id=btn.dataset.id, v=btn.dataset.v;

  if(a==='scrim'){
    if(Date.now()-modalAt<600) return;            // ignore the ghost click that follows opening
    if(e.target===btn){ const back=modal&&modal.back; closeModal();
      if(back){ modalAt=Date.now(); modal=back; } render(); }
    return; }
  if(a==='closemodal'||a==='done'){ const back=modal&&modal.back; closeModal();
    if(back){ modalAt=Date.now(); modal=back; } render(); return; }
  if(a==='undo'){ if(undoCur){ const u=undoCur; undoCur=null; clearTimeout(undoTimer); u.undo(); } setNote(''); render(); save(); return; }
  if(a==='slipped'){ slippedOpen=!slippedOpen; render(); return; }
  if(a==='compare'){ const list=photosAt(v); if(list.length<2) return; await loadPhotos(list.map(p=>p.id));
    modalAt=Date.now(); modal={kind:'compare',key:v,a:0,b:list.length-1}; render(); return; }
  if(a==='cmpstep'){ const list=photosAt(modal.key), side=btn.dataset.side, n=modal[side]+(+btn.dataset.d);
    if(n>=0&&n<list.length){ modal[side]=n; render(); } return; }
  if(a==='calendar'){ openCalendarSheet(); return; }
  if(a==='calshare'){ const f=icsFile(modal.text);
    try{ await navigator.share({files:[f],title:'House HQ calendar'}); modal=null; render(); }
    catch(e){ if(e&&e.name!=='AbortError') setNote('Sharing did not work here. Save the file or copy the text instead.'); }
    return; }
  if(a==='caldl'){ if(!saveFile(modal.text,'house-hq.ics','text/calendar')) setNote('This browser blocked the download. Copy the text instead.'); return; }
  if(a==='calcopy'){ const t=modal.text;
    if(navigator.clipboard) navigator.clipboard.writeText(t).then(()=>setNote('Calendar text copied.','ok'),()=>selectText('ics'));
    else selectText('ics');
    return; }
  if(a==='clearnote'){ setNote(''); return; }
  if(a==='clearq'){ q=''; render(); return; }
  if(a==='jump'){ if(!id) return;
    if((S.tasks||[]).some(x=>x.id===id)){ modalAt=Date.now(); modal={kind:'detail',id}; render(); return; }
    if((S.yearly||[]).some(x=>x.id===id)){ modalAt=Date.now(); modal={kind:'yeardetail',id}; render(); return; }
    if((S.equipment||[]).some(x=>x.id===id)){ tab='gear'; openEquip=id; q=''; render(); return; }
    return; }
  if(a==='equipjump'){ tab='gear'; openEquip=v; q=''; render(); return; }
  if(a==='fvsheet'){ if(modal&&modal.payload){ modal.payload.sheet=v;
      const h=document.getElementById('fv'); if(h){ h.innerHTML=''; paintViewer(h,modal.payload); } } return; }
  if(a==='fileout'){ await downloadFile(id); return; }
  if(a==='viewfull'){ await loadPhotos([id]); const back=modal||null;
    modalAt=Date.now(); modal={kind:'photo',id,back}; render(); return; }
  if(a==='pstep'){ if(!modal||modal.kind!=='photodetail') return;
    const cur=S.photos.find(x=>x.id===modal.id); if(!cur) return;
    const list=photosAt((cur.where||'').trim().toLowerCase());
    const n=list.findIndex(x=>x.id===cur.id)+(+btn.dataset.d);
    if(n<0||n>=list.length) return;
    modal.id=list[n].id; await loadPhotos([modal.id]); render(); return; }
  if(a==='tab'){ tab=v; editing=false; closeModal(); render(); return; }
  if(a==='settings'){ if(tab==='settings'){ tab=VIEWS[prevTab]&&prevTab!=='settings'?prevTab:'seasons'; } else { prevTab=tab; tab='settings'; }
    editing=false; closeModal(); render(); return; }
  if(a==='edit'){ editing=!editing; render(); return; }
  if(a==='filter'){ filter=v; render(); return; }
  if(a==='pickseason'){ seasonSel=v; render(); return; }
  if(a==='equip'){ openEquip=openEquip===id?null:id; render(); return; }
  if(a==='theme'){ S.theme=v; LS('hq:theme',v); render(); save(); return; }
  if(a==='nightauto'){ LS('hq:night',pref.night()?null:'1'); render(); return; }
  if(a==='bigtext'){ LS('hq:big',pref.big()?null:'1'); render(); return; }
  if(a==='year'){ const yr=+v; if(yr>new Date().getFullYear()) return; S.activeYear=yr; render(); save(); return; }

  if(a==='toggletask'){ const t=S.tasks.find(x=>x.id===id); if(!t) return;
    t.done=!t.done; t.doneAt=t.done?Date.now():null; t.doneBy=t.done?pref.who():''; render(); save(); return; }
  if(a==='toggleyear'){ const k=btn.dataset.k||yearKey(id,S.activeYear);
    if(S.yearlyDone[k]) delete S.yearlyDone[k]; else S.yearlyDone[k]=tick(); render(); save(); return; }
  if(a==='toggleequip'){ const k=id+':'+btn.dataset.cid+':'+S.activeYear;
    if(S.equipDone[k]){ delete S.equipDone[k]; render(); save(); return; }
    S.equipDone[k]=tick(); render(); save();
    const e2=S.equipment.find(x=>x.id===id), ck=e2&&e2.checks.find(c=>c.id===btn.dataset.cid);
    if(ck) setNote(`Ticked for ${S.activeYear}.`,'ok',{label:'Add what you did',act:'log',id:e2.id,sub:e2.name,what:ck.title});
    return; }

  if(a==='newtask'){ modalAt=Date.now(), modal={kind:'task',draft:{id:uid(),cat:'',title:'',when:'First month',contact:'',url:'',notes:'',cost:'',done:false,doneAt:null,photos:[]},isNew:true}; render(); return; }
  if(a==='edittask'){ modalAt=Date.now(), modal={kind:'task',draft:{...S.tasks.find(x=>x.id===id)}}; render(); return; }
  if(a==='detail'){ modalAt=Date.now(), modal={kind:'detail',id}; render(); return; }
  if(a==='deltask'){ const i=S.tasks.findIndex(x=>x.id===id); if(i<0) return;
    const [t]=S.tasks.splice(i,1);
    deleted('\u201c'+(t.title||'Untitled')+'\u201d',()=>S.tasks.splice(i,0,t)); return; }

  if(a==='newyear'){ modalAt=Date.now(); modal={kind:'yearitem',isNew:true,
    draft:{id:uid(),season:v,month:0,title:'',cat:'',freq:'Annual',notes:''}}; render(); return; }
  if(a==='edityear'){ const back=modal&&modal.kind==='yeardetail'?{kind:'yeardetail',id:modal.id}:null;
    modalAt=Date.now(); modal={kind:'yearitem',back,draft:{...S.yearly.find(x=>x.id===id)}}; render(); return; }
  if(a==='yeardetail'){ modalAt=Date.now(); modal={kind:'yeardetail',id}; render(); return; }
  if(a==='delyear'){ const i=S.yearly.findIndex(z=>z.id===id); if(i<0) return;
    const [x]=S.yearly.splice(i,1), keep={};
    Object.keys(S.yearlyDone).forEach(k=>{ if(k.startsWith(id+':')){ keep[k]=S.yearlyDone[k]; delete S.yearlyDone[k]; } });
    if(modal&&modal.kind==='yeardetail'&&modal.id===id) modal=null;
    deleted('\u201c'+x.title+'\u201d',()=>{ S.yearly.splice(i,0,x); Object.assign(S.yearlyDone,keep); }); return; }
  if(a==='log'){ const now=new Date(); if(noteMsg&&noteKind==='ok') setNote('');
    modalAt=Date.now(), modal={kind:'log',draft:{id:uid(),refId:id,subject:btn.dataset.sub||'',date:now.toISOString().slice(0,10),
      time:now.toTimeString().slice(0,5),what:btn.dataset.what||'',who:pref.who(),cost:'',doc:'',photos:[]}}; render(); return; }
  if(a==='dellog'){ const i=S.logs.findIndex(l=>l.id===id); if(i<0) return;
    const [l]=S.logs.splice(i,1); deleted('the record from '+l.date,()=>S.logs.splice(i,0,l)); return; }

  if(a==='snap'){ pick(async files=>{
      const ids=[];
      for(const f of files){ const pid=await addPhoto(f,{caption:'',where:''}); if(pid) ids.push(pid); }
      if(ids.length){ modalAt=Date.now(); modal={kind:'task',isNew:true,draft:{id:uid(),cat:'Watch',title:'',when:'Watch',contact:'',url:'',notes:'',cost:'',done:false,doneAt:null,photos:ids}}; commitDraft(); }
      render();
    }); return; }
  if(a==='snapfree'){ pick(async files=>{
      let n=0; for(const f of files){ if(await addPhoto(f,{caption:'',where:''})) n++; }
      if(files.length>1) setNote(n===files.length?`${n} photos added.`:`${n} of ${files.length} photos added.`,'ok');
      render(); }); return; }
  if(a==='reshoot'){ const old=S.photos.find(x=>x.id===id); if(!old) return;
    pick(async files=>{
      const pid=await addPhoto(files[0],{caption:old.caption||'',where:old.where||''});
      if(pid){
        const fresh=S.photos.find(x=>x.id===pid);
        if(fresh&&old.recheckEvery){ fresh.recheckEvery=old.recheckEvery; fresh.recheck=isoOf(addMonths(today0(),old.recheckEvery)); }
        old.recheck=''; await save();
        modalAt=Date.now(); modal={kind:'photodetail',id:pid};
      }
      render();
    }); return; }
  if(a==='mphoto'){ pick(async files=>{
      for(const f of files){
        const pid=await addPhoto(f,{caption:modal.draft.title||modal.draft.subject||'',where:''});
        if(pid && modal && modal.draft){ modal.draft.photos.push(pid); commitDraft(); }
      }
      render();
    }); return; }
  if(a==='viewphoto'){ setNote(''); await loadPhotos([id]); const back=modal||null;
    modalAt=Date.now(); modal={kind:'photodetail',id,back}; render(); return; }
  if(a==='delphoto'){ const i=S.photos.findIndex(p=>p.id===id); if(i<0) return;
    if(modal&&(modal.kind==='photodetail'||modal.kind==='photo')&&modal.id===id){
      let b=modal.back;
      while(b&&(b.kind==='photodetail'||b.kind==='photo')&&b.id===id) b=b.back;
      closeModal(); modal=b||null; }
    const [ph]=S.photos.splice(i,1), data=photoCache[id], inline=S.photoData&&S.photoData[id];
    const refs=[];
    [...S.tasks,...S.logs].forEach(o=>{ const j=(o.photos||[]).indexOf(id); if(j>=0){ refs.push([o,j]); o.photos.splice(j,1); } });
    if(S.photoData) delete S.photoData[id];
    const th=thumbCache[id]; delete photoCache[id]; delete thumbCache[id];
    deleted('the photo'+(ph.caption?' \u201c'+ph.caption+'\u201d':''),
      ()=>{ S.photos.splice(i,0,ph); refs.forEach(([o,j])=>o.photos.splice(j,0,id)); photoCache[id]=data; thumbCache[id]=th; if(inline) S.photoData[id]=inline; },
      ()=>{ store.del(PKEY(id)); store.del(TKEY(id)); cloud.deletePhoto(id); });
    return; }

  if(a==='closeout'){ S.closedPhases[v]=new Date().toISOString().slice(0,10);
    if(filter===v) filter='All';
    if(!setupOpen()){ tab='seasons'; editing=false; setNote('Setup finished. The seasonal list is home now; the old list is on the House tab if you ever need it.','ok'); }
    render(); save(); return; }
  if(a==='reopenphase'){ delete S.closedPhases[v]; render(); save(); return; }
  if(a==='reopenall'){ S.closedPhases={}; tab='list'; filter='All'; render(); save(); return; }

  if(a==='addspec'){ S.specs.push({id:uid(),k:'',v:''}); render(); save(); return; }

/* House codes. A suggested one is two words and four random characters: easy to read out, hard to guess. */
const CODE_WORDS=['maple','cedar','birch','pine','oak','aspen','spruce','river','creek','ridge','meadow','prairie','stone','brook','trail','harbor','lantern','north','county','cabin'];
function suggestCode(){
  const w=()=>CODE_WORDS[Math.floor(Math.random()*CODE_WORDS.length)];
  const a=w(); let b=w(); while(b===a) b=w();
  const alphabet='abcdefghjkmnpqrstuvwxyz23456789'; let tail='';
  try{ for(const n of crypto.getRandomValues(new Uint8Array(4))) tail+=alphabet[n%alphabet.length]; }
  catch(e){ while(tail.length<4) tail+=alphabet[Math.floor(Math.random()*alphabet.length)]; }
  return a+'-'+b+'-'+tail;
}
const normCode=v=>String(v||'').trim().toLowerCase();
const codeError=code=>/^[a-z0-9][a-z0-9-]{7,39}$/.test(code)?'':'The code needs eight to forty characters: letters, numbers and dashes only.';

/* ---------- erase this phone ---------- */
async function eraseEverything(alsoCloud){
  if(alsoCloud){
    setNote('Deleting the house from the cloud…','ok');
    try{ await cloud.eraseHouse(); }
    catch(e){ oops('deleting the house',e); setNote('Could not delete the house from the cloud: '+friendlyErr(e)+' Nothing on this phone was erased.'); return; }
  }
  erasing=true; clearTimeout(saveTimer); savePending=false;
  cloud.stopListening(); clearTimeout(cloud.pullT); cloud.status='off';
  setNote('Erasing…','ok');
  try{ await store.clear(); }catch(e){ oops('erasing',e); }
  try{ for(let i=localStorage.length-1;i>=0;i--){ const k=localStorage.key(i); if(k&&k.startsWith('hq:')) localStorage.removeItem(k); } }catch(e){}
  try{ if(cloud.FB&&cloud.db){ await cloud.FB.terminate(cloud.db); await cloud.FB.clearIndexedDbPersistence(cloud.db); } }catch(e){}
  location.reload();
}

/* ---------- backup / restore / export ---------- */
const BACKUP_FILE_MAX=15*1024*1024, BACKUP_FILES_TOTAL=40*1024*1024;
async function backup(){
  setNote('Gathering everything…','ok');
  const photos={};
  for(const p of S.photos){ const d=photoCache[p.id]??(S.photoData&&S.photoData[p.id])??await store.get(PKEY(p.id)); if(d) photos[p.id]=d; }
  // the deed, the well report, the blueprints: in the backup too, up to a sensible size
  const files={}; let kept=0, skipped=[], bytes=0;
  for(const f of (S.files||[])){
    if(!f.stored) continue;
    if(f.size>BACKUP_FILE_MAX||bytes+f.size>BACKUP_FILES_TOTAL){ skipped.push(f.name); continue; }
    const d=await getFileData(f.id);
    if(!d){ skipped.push(f.name); continue; }
    try{ files[f.id]=await base64Of(d); kept++; bytes+=f.size; }catch(e){ skipped.push(f.name); }
  }
  const text=JSON.stringify({app:'househq',v:4,state:S,photos,files},null,1);
  setNote('');
  modalAt=Date.now(), modal={kind:'backup',text,kept,skipped}; render();
}
function markBackedUp(){ S.lastBackup=new Date().toISOString(); save(); if(tab==='settings'&&!modal) render(); }
function saveFile(text,name,type){
  try{
    const blob=new Blob([text],{type});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url; a.download=name;
    a.style.display='none';
    document.body.appendChild(a);
    a.click();
    setTimeout(()=>{ document.body.removeChild(a); URL.revokeObjectURL(url); },3000);
    return true;
  }catch(e){ return false; }
}
/* Bring any older save up to the current shape. Works on any state object,
   so a restore can be checked over before it replaces what is here. */
function normalize(st){
  if(!st||typeof st!=='object') throw new Error('not a House HQ state');
  for(const k of ['tasks','yearly','equipment','specs','logs','photos','contacts','budget','buy','files','keyDates','readings','fuel'])
    if(!Array.isArray(st[k])) st[k]=[];
  if(!st.keyDates.length) st.keyDates=keyDateSeed();
  st.tasks.forEach(t=>{ if(t.contactId===undefined) t.contactId=''; });
  st.yearly.forEach(x=>{ if(x.contactId===undefined) x.contactId=''; });
  st.photos.forEach(p=>{ if(p.recheck===undefined){ p.recheck=''; p.recheckEvery=0; } });
  for(const k of ['yearlyDone','equipDone','photoData'])
    if(!st[k]||typeof st[k]!=='object') st[k]={};
  if(!st.budget.length) st.budget=budgetSeed();
  if(!st.closedPhases||typeof st.closedPhases!=='object'){
    st.closedPhases={};
    if(st.closingDone) st.closedPhases['Before closing']=new Date().toISOString().slice(0,10);
    delete st.closingDone;
  }
  // The seasonal list starts fresh every January on its own; past years stay browsable.
  st.activeYear=new Date().getFullYear();
  st.yearly.forEach(x=>{ if(!x.season) x.season=seasonOf(x.month||1); if(x.month===undefined||x.month===null) x.month=0; });
  if(!st.createdAt) st.createdAt=new Date().toISOString();
  if(!st.propertyName) st.propertyName='My house';
  st.contacts.forEach(c=>{ if(c.url===undefined) c.url=''; if(c.note===undefined) c.note=''; });
  st.photos.forEach(p=>{ if(p.note===undefined) p.note=''; });
  st.files.forEach(f=>{ if(f.note===undefined) f.note=''; });
  st.v=7;
  return st;
}
/* A gentle reminder to back up: after two weeks with none, then every two months. Snoozes two weeks once shown. */
function backupNudge(){
  if(!store.saving()||noteMsg) return;
  const day=864e5, now=Date.now();
  const last=S.lastBackup?Date.parse(S.lastBackup):null;
  const age=(now-(last||Date.parse(S.createdAt)))/day;
  const since=S.backupNagAt?(now-Date.parse(S.backupNagAt))/day:99;
  if(age>=(last?60:14)&&since>=14){
    S.backupNagAt=new Date().toISOString(); save();
    setNote(last?`It has been ${Math.round(age)} days since your last backup. Grab one from Settings, the gear at the top.`:'No backup yet. Grab one from Settings, the gear at the top, when you get a minute.');
  }
}
async function applyRestore(text){
  // Read it all the way through before anything here is touched.
  let next;
  try{
    const data=JSON.parse(text);
    if(!data||!data.state||typeof data.state!=='object') throw 0;
    const raw=data.state;
    if(data.app&&data.app!=='househq') throw 0;
    // Every list in a real backup is a list. Anything else is some other file.
    for(const k of ['tasks','yearly','equipment','logs','photos','contacts','files','budget','buy','specs'])
      if(raw[k]!==undefined&&!Array.isArray(raw[k])) throw 0;
    if(!data.app&&!Array.isArray(raw.tasks)) throw 0;
    next=normalize(JSON.parse(JSON.stringify(raw)));
    var payload=data;
  }catch(err){ setNote('That did not look like a House HQ backup, so nothing here was changed.'); return; }
  try{
    const data=payload;
    S=next;
    if(!setupOpen()) tab='seasons';
    if(data.photos) for(const id in data.photos){ photoCache[id]=data.photos[id]; await store.set(PKEY(id),data.photos[id]); cloud.photoWritten(id,data.photos[id]); }
    if(data.files) for(const id in data.files){ fileCache[id]=data.files[id]; await store.set(FKEY(id),data.files[id]); cloud.fileWritten(id); }
    modal=null; render(); save(); setNote('');
  }catch(err){ oops('restoring',err); setNote('The backup loaded, but something in it would not save.'); }
}
function pickBackupFile(){
  const inp=document.createElement('input'); inp.type='file'; inp.accept='application/json,.json,text/plain';
  inp.onchange=async()=>{ const f=inp.files[0]; if(f) await applyRestore(await f.text()); };
  inp.click();
}
function selectText(elId){
  const ta=document.getElementById(elId);
  if(ta){ ta.focus(); ta.select(); setNote('Copy was blocked. The text is selected, so use your copy button.'); }
}
/* ---------- handoff pack ----------
   Everything the next person needs on one page: the adjuster, the buyer,
   or a folder in the safe. Printing it is how it becomes a PDF. */
function hoSection(title,inner){ return inner?`<section><h2>${esc(title)}</h2>${inner}</section>`:''; }
function hoTable(rows){
  const body=rows.filter(r=>r&&r.length).map(r=>`<tr>${r.map((c,i)=>`<t${i?'d':'h'}>${esc(c==null?'':String(c))}</t${i?'d':'h'}>`).join('')}</tr>`).join('');
  return body?`<table>${body}</table>`:'';
}
function buildHandoff(){
  const y=new Date().getFullYear();
  const kd=(S.keyDates||[]).filter(k=>k.date).map(k=>{ const w=nextOccur(k);
    return [k.title,w?fmtDate(isoOf(w)):'',repeatWord(k.every),k.note||'']; });
  const sizes=(S.specs||[]).filter(sp=>(sp.k||'').trim()||(sp.v||'').trim()).map(sp=>[sp.k,sp.v]);
  const gear=(S.equipment||[]).map(e=>`<h3>${esc(e.name)}</h3>
    <p class="sub">${esc([e.make,e.model].filter(Boolean).join(' '))}${e.serial?' · serial '+esc(e.serial):''}</p>
    ${hoTable((e.specs||[]).filter(sp=>(sp.v||'').trim()).map(sp=>[sp.k,sp.v]))}
    ${(e.checks||[]).length?`<p class="sub">Tune-up: ${esc((e.checks||[]).map(c=>c.title+(c.freq?' ('+c.freq+')':'')).join('; '))}</p>`:''}`).join('');
  const contacts=hoTable((S.contacts||[]).map(c=>[c.name,[c.role,c.phone,c.note].filter(Boolean).join(' · ')]));
  const logs=(S.logs||[]).slice().sort((a,b)=>(b.date||'').localeCompare(a.date||''))
    .map(l=>[fmtDate(l.date),l.subject||'',[l.what,l.who,l.cost?'$'+l.cost:'',l.doc].filter(Boolean).join(' · ')]);
  const readings=readingGroups().map(g=>`<h3>${esc(g.name)}</h3>${
    hoTable(g.rows.map(r=>[fmtDate(r.date),r.value+(r.unit?' '+r.unit:''),r.note||'']))}`).join('');
  const fuelRows=(S.fuel||[]).slice().sort((a,b)=>(b.date||'').localeCompare(a.date||''))
    .map(f=>[fmtDate(f.date),(f.gallons||'')+' gal',fuelCost(f)?money(fuelCost(f)):'',f.vendor||'']);
  const seasonal=hoTable((S.yearly||[]).map(x=>[x.title,[x.season,x.month?MONTHS[x.month-1]:'',x.freq].filter(Boolean).join(' · ')]));
  const shots=(S.photos||[]).filter(p=>photoCache[p.id]).slice(0,30);
  const photos=shots.map(p=>`<figure><img src="${photoCache[p.id]}" alt="">
    <figcaption><b>${esc(p.caption||'Not named')}</b>${p.where?' — '+esc(p.where):''}<br>${esc(fmtDate(p.addedAt))}${p.note?'<br>'+esc(p.note):''}</figcaption></figure>`).join('');
  const files=hoTable((S.files||[]).map(f=>[f.name,[f.cat,f.stored?prettySize(f.size):'link',f.note].filter(Boolean).join(' · ')]));
  return `<!doctype html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>${esc(S.propertyName||'House')} — handoff</title>
<style>
  *{box-sizing:border-box}
  body{font:14px/1.5 -apple-system,Segoe UI,Roboto,sans-serif;color:#15201b;margin:0;padding:26px 22px 40px;background:#fff}
  h1{font-size:27px;margin:0 0 2px}
  .lede{color:#5a6a63;margin:0 0 22px}
  h2{font-size:18px;margin:26px 0 6px;padding-bottom:4px;border-bottom:2px solid #15201b}
  h3{font-size:15px;margin:14px 0 2px}
  p.sub{color:#5a6a63;margin:0 0 6px;font-size:13px}
  table{border-collapse:collapse;width:100%;margin:4px 0 10px}
  th,td{border:1px solid #d5dbd6;padding:6px 8px;text-align:left;vertical-align:top;font-size:13px}
  th{width:38%;font-weight:600;background:#f2f5f3}
  figure{margin:0 0 14px;break-inside:avoid;page-break-inside:avoid}
  figure img{width:100%;max-width:330px;border:1px solid #d5dbd6;border-radius:4px;display:block}
  figcaption{font-size:12px;color:#5a6a63;margin-top:3px}
  section{break-inside:auto}
  @media print{ body{padding:0} h2{break-after:avoid} }
</style></head><body>
<h1>${esc(S.propertyName||'House')}</h1>
<p class="lede">Everything on record, printed ${esc(fmtDate(isoOf(new Date())))}.</p>
${hoSection('Key dates',hoTable(kd))}
${hoSection('Sizes and part numbers',hoTable(sizes))}
${hoSection('Equipment',gear)}
${hoSection('Who to call',contacts)}
${hoSection('Service history',hoTable(logs))}
${hoSection('Readings',readings)}
${hoSection('Fuel deliveries',hoTable(fuelRows))}
${hoSection('The seasonal round',seasonal)}
${hoSection('Papers and plans on file',files)}
${hoSection('Photographs',photos)}
<p class="lede" style="margin-top:26px">Made with House HQ${shots.length<(S.photos||[]).length?` · ${shots.length} of ${(S.photos||[]).length} photographs included`:''}.</p>
</body></html>`;
}

/* ---------- tables for a spreadsheet ----------
   Tab-separated pastes straight into Excel or Sheets as columns. */
const tsvCell=v=>String(v==null?'':v).replace(/[\t\r\n]+/g,' ');
function tableFor(what){
  if(what==='readings'){
    const rows=(S.readings||[]).slice().sort((a,b)=>(a.date||'').localeCompare(b.date||''));
    return [['Date','Measured','Reading','Units','Note'],...rows.map(r=>[r.date,r.metric,r.value,r.unit,r.note])];
  }
  const rows=(S.fuel||[]).slice().sort((a,b)=>(a.date||'').localeCompare(b.date||''));
  return [['Date','Gallons','Price a gallon','Total','Vendor','Budget line','Note'],
    ...rows.map(f=>[f.date,f.gallons,f.price?num(f.price).toFixed(2):'',fuelCost(f)?fuelCost(f).toFixed(2):'',f.vendor,
      ((S.budget||[]).find(l=>l.id===f.lineId)||{}).name||'',f.note])];
}
async function copyTable(what){
  const rows=tableFor(what);
  const tsv=rows.map(r=>r.map(tsvCell).join('\t')).join('\n');
  const csv=rows.map(r=>r.map(c=>'"'+String(c==null?'':c).replace(/"/g,'""')+'"').join(',')).join('\r\n');
  try{ await navigator.clipboard.writeText(tsv); setNote(`${rows.length-1} rows copied — paste into a sheet and they land in columns.`,'ok'); }
  catch(e){
    if(saveFile(csv,`househq-${what}-${new Date().toISOString().slice(0,10)}.csv`,'text/csv')) setNote('Copy was blocked, so a CSV file was saved instead.','ok');
    else setNote('Could not copy or save from here.');
  }
}

/* ---------- calendar export ---------- */
const icsText=v=>String(v??'').replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\r?\n/g,'\\n');
const icsLine=l=>(l.match(/[\s\S]{1,60}/g)||['']).join('\r\n ');
function buildICS(){
  const now=new Date(), thisY=now.getFullYear(), thisM=now.getMonth()+1;
  const stamp=now.toISOString().replace(/[-:]/g,'').slice(0,15)+'Z';
  const pad=n=>String(n).padStart(2,'0');
  const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//House HQ//EN','CALSCALE:GREGORIAN','METHOD:PUBLISH','X-WR-CALNAME:House HQ'];
  let count=0;
  for(const x of S.yearly){
    if(!(x.title||'').trim()) continue;
    const month=+x.month||seasonMonths(x.season)[0]||1;
    const fi=freqInfo(x.freq);
    let year=month>=thisM?thisY:thisY+1;
    if(fi.years>1){ const last=lastDoneBefore(x.id,thisY+1); if(last&&last+fi.years>year) year=last+fi.years; }
    const rule=fi.months?`FREQ=MONTHLY;INTERVAL=${fi.months}`:fi.weeks?'FREQ=WEEKLY':`FREQ=YEARLY${fi.years>1?';INTERVAL='+fi.years:''}`;
    const d=`${year}${pad(month)}01`, dEnd=`${year}${pad(month)}02`;   // one day, not the whole month
    const desc=[x.cat,x.freq,x.notes].filter(Boolean).join(' — ');
    L.push('BEGIN:VEVENT',`UID:${x.id}@househq`,`DTSTAMP:${stamp}`,`DTSTART;VALUE=DATE:${d}`,`DTEND;VALUE=DATE:${dEnd}`,`RRULE:${rule}`,
      icsLine(`SUMMARY:${icsText(x.title)}`),icsLine(`DESCRIPTION:${icsText(desc)}`),
      'BEGIN:VALARM','ACTION:DISPLAY',icsLine(`DESCRIPTION:${icsText(x.title)}`),'TRIGGER:PT9H','END:VALARM','END:VEVENT');
    count++;
  }
  for(const k of (S.keyDates||[])){
    const when=nextOccur(k); if(!when||!(k.title||'').trim()) continue;
    const d=`${when.getFullYear()}${pad(when.getMonth()+1)}${pad(when.getDate())}`;
    const after=new Date(when.getTime()+DAY);
    const dEnd=`${after.getFullYear()}${pad(after.getMonth()+1)}${pad(after.getDate())}`;
    const rule=+k.every?`FREQ=YEARLY${+k.every>1?';INTERVAL='+k.every:''}`:'';
    L.push('BEGIN:VEVENT',`UID:kd-${k.id}@househq`,`DTSTAMP:${stamp}`,
      `DTSTART;VALUE=DATE:${d}`,`DTEND;VALUE=DATE:${dEnd}`);
    if(rule) L.push(`RRULE:${rule}`);
    L.push(icsLine(`SUMMARY:${icsText(k.title)}`),icsLine(`DESCRIPTION:${icsText(k.note||'')}`),
      'BEGIN:VALARM','ACTION:DISPLAY',icsLine(`DESCRIPTION:${icsText(k.title)}`),'TRIGGER:PT9H','END:VALARM',
      'BEGIN:VALARM','ACTION:DISPLAY',icsLine(`DESCRIPTION:${icsText(k.title+' — a week out')}`),'TRIGGER:-P6DT15H','END:VALARM',
      'END:VEVENT');
    count++;
  }
  L.push('END:VCALENDAR');
  return {text:L.join('\r\n')+'\r\n',count};
}
function icsFile(text){ try{ return new File([text],'house-hq.ics',{type:'text/calendar'}); }catch(e){ return null; } }
function openCalendarSheet(){
  const {text,count}=buildICS();
  const f=icsFile(text);
  const canShare=!!(f&&navigator.canShare&&navigator.canShare({files:[f]}));
  modalAt=Date.now(); modal={kind:'calendar',text,count,canShare}; render();
}



/* ============================================================
   Reading things without leaving the app
   Photos, blueprints, PDFs and spreadsheets all open here. Sheets and PDFs
   need a reader, which is fetched the first time one is opened and then
   cached by the browser; without a connection they fall back to handing the
   file to another app.
============================================================ */
const LIB_PDF='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
const LIB_PDFW='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
const LIB_SHEET='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
const libs={};
function loadLib(src){
  if(libs[src]) return libs[src];
  libs[src]=new Promise((res,rej)=>{
    const el=document.createElement('script');
    el.src=src; el.async=true;
    el.onload=()=>res(true);
    el.onerror=()=>{ delete libs[src]; rej(new Error('reader unavailable')); };
    document.head.appendChild(el);
  });
  return libs[src];
}
function fileKind(f){
  const n=(f.name||'').toLowerCase(), t=(f.type||'').toLowerCase();
  if(/^image\//.test(t)||/\.(jpe?g|png|gif|webp|bmp|svg|heic|heif)$/.test(n)) return 'image';
  if(/pdf/.test(t)||/\.pdf$/.test(n)) return 'pdf';
  if(/\.(xlsx|xlsm|xlsb|xls|ods)$/.test(n)||/spreadsheetml|ms-excel|opendocument\.spreadsheet/.test(t)) return 'sheet';
  if(/\.(csv|tsv)$/.test(n)||/csv|tab-separated/.test(t)) return 'csv';
  if(/^text\//.test(t)||/\.(txt|md|json|log|xml|html?|ics)$/.test(n)) return 'text';
  return 'other';
}
/* A shared sheet or document can be read right here; most other links cannot
   be shown inside another page, so those just open normally. */
function embedURL(u){
  const v=fixURL(u); if(!v) return '';
  const g=/docs\.google\.com\/(spreadsheets|document|presentation)\/d\/([a-zA-Z0-9_-]{12,})/.exec(v);
  if(g) return 'https://docs.google.com/'+g[1]+'/d/'+g[2]+'/preview';
  if(/docs\.google\.com\/.*(pubhtml|\/pub\b|embed)/.test(v)) return v;
  if(/(onedrive\.live\.com|1drv\.ms|[\w-]+\.sharepoint\.com)/i.test(v))
    return v+(v.indexOf('?')>=0?'&':'?')+'action=embedview&wdAllowInteractivity=True';
  if(/\.(xlsx?|csv|docx?|pptx?)(\?|#|$)/i.test(v))
    return 'https://view.officeapps.live.com/op/embed.aspx?src='+encodeURIComponent(v);
  return '';
}
const isViewableLink=u=>!!embedURL(u);
function parseDelim(text,delim){
  const rows=[]; let row=[], cur='', quoted=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(quoted){
      if(c==='"'){ if(text[i+1]==='"'){ cur+='"'; i++; } else quoted=false; }
      else cur+=c;
    }
    else if(c==='"') quoted=true;
    else if(c===delim){ row.push(cur); cur=''; }
    else if(c==='\n'){ row.push(cur); cur=''; rows.push(row); row=[]; }
    else if(c!=='\r') cur+=c;
  }
  if(cur!==''||row.length){ row.push(cur); rows.push(row); }
  return rows;
}
const GRID_ROWS=400, GRID_COLS=40;
function gridHTML(rows){
  const n=Math.min(rows.length,GRID_ROWS);
  let h='<table class="grid">';
  for(let r=0;r<n;r++){
    const cells=rows[r]||[];
    h+='<tr>'+(cells.length?cells:['']).slice(0,GRID_COLS)
        .map(c=>`<td>${esc(c==null?'':String(c))}</td>`).join('')+'</tr>';
  }
  h+='</table>';
  if(rows.length>n) h+=`<p class="fvmsg">The first ${n} rows of ${rows.length}. Open it in your sheet app for the rest.</p>`;
  return h;
}
let fvURL=null;
function fvRevoke(){ if(fvURL){ try{ URL.revokeObjectURL(fvURL); }catch(e){} fvURL=null; } }

async function buildPayload(f){
  const d=await getFileData(f.id);
  if(!d) return {type:'msg',msg:f.shared===false
    ? 'This file only exists on the phone it was added from.'
    : 'This file is not on this phone yet. Open it once on the phone it came from, or check the connection.'};
  const blob=blobOf(d), kind=fileKind(f);
  if(kind==='image'){ fvRevoke(); fvURL=URL.createObjectURL(blob); return {type:'img',url:fvURL}; }
  if(kind==='pdf') return {type:'pdf',blob};
  if(kind==='csv'){
    const text=await readText(blob);
    return {type:'grid',sheets:{Sheet:parseDelim(text,/\.tsv$/i.test(f.name||'')?'\t':',')},sheet:'Sheet'};
  }
  if(kind==='sheet'){
    try{ await loadLib(LIB_SHEET); }
    catch(e){ return {type:'msg',msg:'The spreadsheet reader could not be fetched. It needs a connection the first time; after that it works offline. Until then, use the button at the top right to open the file in your sheet app.'}; }
    const XL=window.XLSX;
    if(!XL) return {type:'msg',msg:'The spreadsheet reader did not load. Open the file in your sheet app instead.'};
    const wb=XL.read(new Uint8Array(await blob.arrayBuffer()),{type:'array'});
    const sheets={};
    wb.SheetNames.forEach(n=>{ sheets[n]=XL.utils.sheet_to_json(wb.Sheets[n],{header:1,defval:'',raw:false,blankrows:false}); });
    return {type:'grid',sheets,sheet:wb.SheetNames[0]};
  }
  if(kind==='text') return {type:'text',text:(await readText(blob)).slice(0,200000)};
  return {type:'msg',msg:'This kind of file cannot be shown here. Use the button at the top right to open it in another app.'};
}
function readText(blob){
  if(blob.text) return blob.text();
  return new Promise((res,rej)=>{ const r=new FileReader();
    r.onload=()=>res(String(r.result)); r.onerror=()=>rej(new Error('could not read it')); r.readAsText(blob); });
}
async function renderPDF(host,p){
  try{
    await loadLib(LIB_PDF);
    const lib=window.pdfjsLib; if(!lib) throw new Error('no reader');
    try{ lib.GlobalWorkerOptions.workerSrc=LIB_PDFW; }catch(e){}
    const doc=await lib.getDocument({data:new Uint8Array(await p.blob.arrayBuffer())}).promise;
    host.innerHTML='<div class="fvpad" id="fvpages"></div>';
    const pages=document.getElementById('fvpages');
    const shown=Math.min(doc.numPages,25);
    const width=Math.max(280,(host.clientWidth||360)-20);
    const dpr=Math.min(2,window.devicePixelRatio||1);
    for(let i=1;i<=shown;i++){
      if(!document.getElementById('fvpages')) return;          // the viewer was closed
      const page=await doc.getPage(i);
      const base=page.getViewport({scale:1});
      const vp=page.getViewport({scale:(width/base.width)*dpr});
      const c=document.createElement('canvas');
      c.width=Math.round(vp.width); c.height=Math.round(vp.height);
      pages.appendChild(c);
      await page.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;
    }
    if(doc.numPages>shown)
      pages.insertAdjacentHTML('beforeend',`<p class="fvmsg">The first ${shown} pages of ${doc.numPages}.</p>`);
  }catch(e){
    // No reader available: let the browser try it directly.
    fvRevoke(); fvURL=URL.createObjectURL(p.blob);
    host.innerHTML=`<iframe src="${fvURL}"></iframe>`;
  }
}
function paintViewer(host,p){
  if(p.type==='img'){ host.innerHTML=`<div class="fvpad"><img src="${p.url}" alt=""></div>`; return; }
  if(p.type==='text'){ host.innerHTML=`<pre>${esc(p.text)}</pre>`; return; }
  if(p.type==='grid'){
    const names=Object.keys(p.sheets), cur=p.sheet&&p.sheets[p.sheet]?p.sheet:names[0];
    host.innerHTML=(names.length>1
        ? `<div class="sheettabs">${names.map(n=>`<button class="chip ${n===cur?'on':''}" data-act="fvsheet" data-v="${esc(n)}">${esc(n)}</button>`).join('')}</div>`
        : '')
      +(p.sheets[cur]&&p.sheets[cur].length?gridHTML(p.sheets[cur]):'<p class="fvmsg">That sheet is empty.</p>');
    return;
  }
  if(p.type==='pdf'){ host.innerHTML='<p class="fvmsg">Laying out the pages…</p>'; renderPDF(host,p); return; }
  host.innerHTML=`<p class="fvmsg">${esc(p.msg||'')}</p>`;
}
async function mountViewer(){
  const host=document.getElementById('fv');
  if(!host||host.firstChild||!modal) return;
  if(modal.kind==='handoff'){ host.innerHTML=`<iframe srcdoc="${esc(modal.html)}"></iframe>`; return; }
  if(modal.kind!=='fileview') return;
  if(modal.link){
    host.innerHTML=`<iframe src="${esc(modal.src)}" referrerpolicy="no-referrer" allowfullscreen></iframe>`;
    return;
  }
  const f=S.files.find(x=>x.id===modal.id);
  if(!f){ host.innerHTML='<p class="fvmsg">That file is no longer here.</p>'; return; }
  if(modal.payload){ paintViewer(host,modal.payload); return; }
  host.innerHTML='<p class="fvmsg">Opening…</p>';
  let payload;
  try{ payload=await buildPayload(f); }
  catch(e){ oops('opening a file',e); payload={type:'msg',msg:'That file would not open here — '+((e&&e.message)||'unknown problem')+'. Try the button at the top right.'}; }
  if(!modal||modal.kind!=='fileview'||modal.id!==f.id) return;   // moved on while it loaded
  modal.payload=payload;
  const again=document.getElementById('fv');
  if(again){ again.innerHTML=''; paintViewer(again,payload); }
}

/* ============================================================
   Boot
============================================================ */
(async()=>{
  await store.init();
  try{ const pj=await store.get(PREJOIN_KEY); prejoin=pj?JSON.parse(pj):null; }catch(e){ prejoin=null; }
  const raw=await store.get(KEY);
  const fresh=!raw; bootFresh=fresh;
  try{ S=raw?JSON.parse(raw):seed(); }catch(e){ S=seed(); }
  normalize(S);
  const lt=LS('hq:theme'); if(lt&&THEMES[lt]) S.theme=lt;
  if(!setupOpen()) tab='seasons';
  if(!store.saving()) setNote('This browser is not letting the app save. Download a backup before you close it.');
  render();
  await cloud.init(fresh);
  if(!modal){
    if(fresh&&!cloud.code){ modalAt=Date.now(); modal={kind:'welcome',mode:'',pname:'',who:pref.who(),code:''}; render(); }
    else if(!cloud.code&&!LS('hq:nocloud')&&location.protocol==='https:'){ modalAt=Date.now(); modal={kind:'connect',mode:'',code:''}; render(); }
  }
  backupNudge();
  try{ const mq=window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)');
    if(mq&&mq.addEventListener) mq.addEventListener('change',()=>render()); }catch(e){}
  if('serviceWorker' in navigator&&location.protocol==='https:') navigator.serviceWorker.register('./sw.js').catch(()=>{});
})();
</script>
