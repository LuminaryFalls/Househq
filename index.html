window.loadFB=async()=>{
  if(window.FB!==undefined) return window.FB;
  try{
    const B='https://www.gstatic.com/firebasejs/'+(window.FIREBASE_SDK_VERSION||'12.17.1')+'/';
    const [a,f,u]=await Promise.all([import(B+'firebase-app.js'),import(B+'firebase-firestore.js'),import(B+'firebase-auth.js')]);
    window.FB={...a,...f,...u};
  }catch(e){ window.FB=null; window.FBerr=e; }
  return window.FB;
};
window.dispatchEvent(new Event('fbloader'));

/* ============================================================
   Storage
   On a phone or in a normal browser: IndexedDB, which has room
   for photos. If that is blocked: localStorage. Inside Claude:
   the artifact storage. Memory as a last resort.
   Everything saves automatically — there is no Save button.
============================================================ */
const BUILD='2026-09-12e';        // keep in step with VERSION in sw.js
const KEY='househq3', PKEY=id=>'hqphoto:'+id, TKEY=id=>'hqthumb:'+id;
const timeout=(p,ms)=>Promise.race([p,new Promise((_,rej)=>setTimeout(()=>rej(new Error('timed out')),ms))]);

const idb={
  db:null,
  open(){
    return new Promise((res,rej)=>{
      let req;
      try{ req=indexedDB.open('househq',1); }catch(e){ return rej(e); }
      req.onupgradeneeded=()=>{ const db=req.result; if(!db.objectStoreNames.contains('kv')) db.createObjectStore('kv'); };
      req.onsuccess=()=>{ this.db=req.result; this.db.onversionchange=()=>{ this.db.close(); this.db=null; }; res(); };
      req.onerror=()=>rej(req.error||new Error('could not open the database'));
      req.onblocked=()=>rej(new Error('database blocked'));
    });
  },
  tx(mode,fn){
    return new Promise((res,rej)=>{
      if(!this.db) return rej(new Error('database closed'));
      let out;
      const tx=this.db.transaction('kv',mode);
      tx.oncomplete=()=>res(out);
      tx.onerror=()=>rej(tx.error||new Error('transaction failed'));
      tx.onabort=()=>rej(tx.error||new Error('transaction aborted'));
      const r=fn(tx.objectStore('kv'));
      if(r) r.onsuccess=()=>{ out=r.result; };
    });
  },
  get(k){ return this.tx('readonly',s=>s.get(k)).then(v=>v===undefined?null:v); },
  set(k,v){ return this.tx('readwrite',s=>s.put(v,k)).then(()=>true); },
  del(k){ return this.tx('readwrite',s=>s.delete(k)).then(()=>true); }
};

const mem={};
const store={
  mode:'memory',
  async init(){
    // Inside Claude the artifact storage is the only thing that persists.
    if(window.storage && typeof window.storage.get==='function'){ this.mode='artifact'; return; }
    try{
      await timeout(idb.open(),4000);
      await timeout(idb.set('__probe__','1'),4000);
      await idb.del('__probe__');
      this.mode='idb';
      await this.migrateFromLocal();
      if(navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(()=>{});
      return;
    }catch(e){}
    try{ localStorage.setItem('__probe__','1'); localStorage.removeItem('__probe__'); this.mode='local'; return; }
    catch(e){}
    this.mode='memory';
  },
  // An earlier version kept its data in localStorage. Carry it over once.
  async migrateFromLocal(){
    try{
      if(await idb.get(KEY)) return;
      const raw=localStorage.getItem(KEY); if(!raw) return;
      await idb.set(KEY,raw);
      for(let i=0;i<localStorage.length;i++){
        const k=localStorage.key(i);
        if(k && k.startsWith('hqphoto:')){ const v=localStorage.getItem(k); if(v) await idb.set(k,v); }
      }
    }catch(e){}
  },
  async get(k){
    if(this.mode==='idb'){ try{ return await idb.get(k); }catch(e){ return null; } }
    if(this.mode==='artifact'){ try{ const r=await timeout(window.storage.get(k,false),8000); return r?r.value:null; }catch(e){ return null; } }
    if(this.mode==='local'){ return localStorage.getItem(k); }
    return mem[k]??null;
  },
  async set(k,v){
    if(this.mode==='idb'){ try{ return await idb.set(k,v); }catch(e){ return false; } }
    if(this.mode==='artifact'){
      for(let attempt=0;attempt<2;attempt++){
        try{ const r=await timeout(window.storage.set(k,v,false),8000); if(r!==null&&r!==undefined) return true; }catch(e){}
        await new Promise(r=>setTimeout(r,400));
      }
      return false;
    }
    if(this.mode==='local'){ try{ localStorage.setItem(k,v); return true; }catch(e){ return false; } }
    mem[k]=v; return true;
  },
  async del(k){
    if(this.mode==='idb'){ try{ return await idb.del(k); }catch(e){ return false; } }
    if(this.mode==='artifact'){ try{ await window.storage.delete(k,false); return true; }catch(e){ return false; } }
    if(this.mode==='local'){ localStorage.removeItem(k); return true; }
    delete mem[k]; return true;
  },
  saving(){ return this.mode!=='memory'; },
  /* Everything House HQ keeps on this phone, gone. */
  async clear(){
    if(this.mode==='idb'){ await idb.tx('readwrite',s=>s.clear()); return; }
    if(this.mode==='artifact'){ try{ const r=await window.storage.list('',false); for(const k of (r&&r.keys)||[]) await window.storage.delete(k,false); }catch(e){} return; }
    if(this.mode==='local'){ for(let i=localStorage.length-1;i>=0;i--){ const k=localStorage.key(i); if(k===KEY||/^(hq(photo|thumb|file):|hq:)/.test(k||'')) localStorage.removeItem(k); } return; }
    for(const k in mem) delete mem[k];
  }
};

  clearTimeout(undoTimer);

}
function deleted(what,undo,finalize){
  finalizeUndo();               // whatever was still waiting gets cleaned up properly first
  const my={undo,finalize}; undoCur=my;

/* ---------- photos ---------- */
async function decode(file){
  if(window.createImageBitmap){
    try{ return await createImageBitmap(file); }catch(e){}
  }
  const url=await new Promise((res,rej)=>{
    const r=new FileReader();
    r.onload=()=>res(r.result);
    r.onerror=()=>rej(new Error('could not read the file'));
    r.readAsDataURL(file);
  });
  return await new Promise((res,rej)=>{
    const i=new Image();
    i.onload=()=>res(i);
    i.onerror=()=>rej(new Error('could not decode the image'));
    i.src=url;
  });
}
async function compress(file,maxDim,quality){
  const src=await decode(file);
  const w=src.width, h=src.height;
  if(!w||!h) throw new Error('image had no dimensions');
  const sc=Math.min(1,maxDim/Math.max(w,h));
  const c=document.createElement('canvas');
  c.width=Math.max(1,Math.round(w*sc));
  c.height=Math.max(1,Math.round(h*sc));
  const ctx=c.getContext('2d');
  if(!ctx) throw new Error('no canvas support');
  ctx.drawImage(src,0,0,c.width,c.height);
  if(src.close) src.close();
  const out=c.toDataURL('image/jpeg',quality);
  if(!out || out.length<100) throw new Error('canvas produced nothing');
  return out;
}
/* The date a picture was taken, read from the JPEG itself. A photo pulled
   from the camera roll should sit on the day it was shot, not the day it was
   added, or comparing across time means nothing. */
async function takenAt(file){
  try{
    const jpeg=/jpe?g/i.test(file.type||'')||/\.jpe?g$/i.test(file.name||'');
    if(jpeg&&file.slice){
      const dv=new DataView(await file.slice(0,262144).arrayBuffer());
      if(dv.byteLength>4&&dv.getUint16(0)===0xFFD8){
        let off=2;
        while(off+4<dv.byteLength){
          const marker=dv.getUint16(off);
          if((marker&0xFF00)!==0xFF00) break;
          const len=dv.getUint16(off+2);
          if(marker===0xFFE1&&dv.getUint32(off+4)===0x45786966){
            const tiff=off+10, little=dv.getUint16(tiff)===0x4949;
            const g16=o=>dv.getUint16(o,little), g32=o=>dv.getUint32(o,little);
            const readIFD=ifd=>{ const tags={}; if(ifd+2>dv.byteLength) return tags; const n=g16(ifd);
              for(let i=0;i<n;i++){ const e=ifd+2+i*12; if(e+12>dv.byteLength) break; tags[g16(e)]={count:g32(e+4),val:e+8}; } return tags; };
            const str=t=>{ const o=t.count>4?tiff+g32(t.val):t.val; let out='';
              for(let i=0;i<t.count-1&&o+i<dv.byteLength;i++) out+=String.fromCharCode(dv.getUint8(o+i)); return out; };
            const t0=readIFD(tiff+g32(tiff+4)); const tags={...t0};
            if(t0[0x8769]) Object.assign(tags,readIFD(tiff+g32(t0[0x8769].val)));
            const t=tags[0x9003]||tags[0x9004]||tags[0x0132];
            if(t){ const m=/^(\d{4}):(\d{2}):(\d{2}) (\d{2}):(\d{2})/.exec(str(t));
              if(m&&+m[1]>1990&&+m[1]<2100) return `${m[1]}-${m[2]}-${m[3]} ${m[4]}:${m[5]}`; }
            break;
          }
          off+=2+len;
        }
      }
    }
    // no EXIF: the file's own date is right for anything older than a fresh capture
    if(file.lastModified&&Date.now()-file.lastModified>5*60000){
      const d=new Date(file.lastModified);
      return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
    }
  }catch(e){}
  return null;
}
async function addPhoto(file,meta){
  const id=uid();
  meta={...meta,taken:await takenAt(file)};
  const tries=[[1400,.72],[1000,.65],[700,.55],[480,.45]];
  let data=null, lastErr='';
  for(const [dim,q] of tries){
    try{ data=await compress(file,dim,q); }
    catch(e){ lastErr=e.message||'could not process the image'; data=null; break; }
    if(cloud.code&&data.length>PHOTO_MAX){ lastErr='too big to share at '+Math.round(data.length/1024)+' KB'; continue; }
    try{
      const ok=await store.set(PKEY(id),data);
      if(ok){ photoCache[id]=data; cloud.photoWritten(id,data); makeThumb(id,file); return finishPhoto(id,meta); }
      lastErr='refused at '+Math.round(data.length/1024)+' KB';
    }catch(e){ lastErr=(e&&e.message)||'storage error'; }
  }
  // separate key refused — keep the picture inside the main record instead
  if(data){
    try{
      if(!S.photoData) S.photoData={};
      S.photoData[id]=data;
      photoCache[id]=data;
      const ok=await store.set(KEY,JSON.stringify(S));
      if(ok){ cloud.photoWritten(id,data); makeThumb(id,file); return finishPhoto(id,meta,true); }
      delete S.photoData[id]; delete photoCache[id];
      lastErr='the record is full';
    }catch(e){ lastErr=(e&&e.message)||'storage error'; }
  }
  oops('saving a photo',new Error(lastErr)); setNote('Photo not saved — '+lastErr+'.');
  return null;
}
async function finishPhoto(id,meta,inline){
  const now=new Date().toISOString().slice(0,16).replace('T',' ');
  S.photos.unshift({id,caption:meta.caption||'',where:meta.where||'',inline:!!inline,by:pref.who(),
    addedAt:meta.taken||now,uploadedAt:now});
  S.photos.sort((a,b)=>(b.addedAt||'').localeCompare(a.addedAt||''));   // an old shot from the roll files under its own day
  await save();
  setNote('');
  return id;
}
async function makeThumb(id,src){
  try{
    const th=await compress(src,THUMB,.62);
    thumbCache[id]=th; await store.set(TKEY(id),th);
  }catch(e){}
}
/* A thumbnail from a full-size picture that is already a data URL. */
function thumbFrom(data){
  return new Promise(res=>{
    try{
      const i=new Image();
      i.onload=()=>{ try{
        const sc=Math.min(1,THUMB/Math.max(i.width||1,i.height||1));
        const c=document.createElement('canvas');
        c.width=Math.max(1,Math.round((i.width||1)*sc)); c.height=Math.max(1,Math.round((i.height||1)*sc));
        c.getContext('2d').drawImage(i,0,0,c.width,c.height);
        const out=c.toDataURL('image/jpeg',.62); res(out&&out.length>100?out:null);
      }catch(e){ res(null); } };
      i.onerror=()=>res(null);
      i.src=data;
    }catch(e){ res(null); }
  });
}
const thumbRetry={};
/* Small pictures for the wall. Older photos with no thumb yet get one made
   from the full size the first time they scroll into view. */
async function loadThumbs(ids){
  const now=Date.now();
  const miss=(ids||[]).filter(i=>thumbCache[i]===undefined||(thumbCache[i]===null&&now-(thumbRetry[i]||0)>30000));
  if(!miss.length) return false;
  for(const id of miss){
    thumbRetry[id]=now;
    let th=await store.get(TKEY(id));
    if(!th){
      let full=photoCache[id]||(S&&S.photoData&&S.photoData[id])||await store.get(PKEY(id));
      if(!full&&cloud.status==='on') full=await cloud.fetchPhoto(id);
      if(full){ photoCache[id]=full; th=await thumbFrom(full); if(th) store.set(TKEY(id),th); else th=full; }
    }
    thumbCache[id]=th||null;
  }
  return true;
}
const thumbOf=id=>thumbCache[id]||photoCache[id]||'';
const photoRetry={};
async function loadPhotos(ids){
  const now=Date.now();
  const miss=(ids||[]).filter(i=>photoCache[i]===undefined||(photoCache[i]===null&&cloud.status==='on'&&now-(photoRetry[i]||0)>20000));
  if(!miss.length) return false;
  for(const id of miss){
    if(S && S.photoData && S.photoData[id]){ photoCache[id]=S.photoData[id]; continue; }
    let d=await store.get(PKEY(id));
    if(!d){ photoRetry[id]=now; d=await cloud.fetchPhoto(id); }   // not on this phone yet: ask the house
    photoCache[id]=d||null;
  }
  return true;
}

function sortCol(col,arr){
  const o=x=>x._o??0;
  if(col==='logs') return arr.sort((a,b)=>(b.date||'').localeCompare(a.date||'')||o(b)-o(a));
  if(col==='photos') return arr.sort((a,b)=>(b.addedAt||'').localeCompare(a.addedAt||'')||o(b)-o(a));
  return arr.sort((a,b)=>o(a)-o(b));
}
function friendlyErr(e){
  const c=(e&&(e.code||e.message)||'')+'';
  if(/permission-denied/.test(c)) return 'Firestore is refusing access. Check the security rules from the setup steps.';
  if(/operation-not-allowed|admin-restricted/.test(c)) return 'Anonymous sign-in is not switched on in Firebase Authentication.';
  if(/api-key|invalid-api-key|project/.test(c)) return 'The Firebase config does not look right.';
  if(/unavailable|network|offline|Failed to fetch/.test(c)) return 'No connection right now.';
  return (e&&e.message)||'something went wrong';
}
/* What changed locally since the last sync, as Firestore writes. */
function diffState(cur,prev){
  const ops=[]; const first=!prev;
  for(const c of SHARED_COLS){
    const a=cur[c]||[], b=prev?(prev[c]||[]):[];
    const bm=new Map(b.map(x=>[x.id,JSON.stringify(x)])), seen=new Set();
    a.forEach((x,i)=>{
      if(x._o==null) x._o=first?i:Date.now()+i;
      seen.add(x.id);
      if(bm.get(x.id)!==JSON.stringify(x)) ops.push({col:c,id:x.id,data:clone(x)});
    });
    for(const id of bm.keys()) if(!seen.has(id)) ops.push({col:c,id,data:null});
  }
  for(const m of CHECK_MAPS){
    const a=cur[m]||{}, b=prev?(prev[m]||{}):{};
    for(const k in a) if(!b[k]) ops.push({col:m,id:k,data:{v:1,...tickInfo(a[k])}});
    for(const k in b) if(!a[k]) ops.push({col:m,id:k,data:null});
  }
  const meta={}; let mc=false;
  for(const f of META_FIELDS){
    const av=cur[f]===undefined?null:cur[f], bv=prev?(prev[f]===undefined?null:prev[f]):undefined;
    if(JSON.stringify(av)!==JSON.stringify(bv)){ meta[f]=av; mc=true; }
  }
  return {ops,meta:mc?meta:null};
}
function applyToSynced(ls,op){
  if(CHECK_MAPS.includes(op.col)){ ls[op.col]=ls[op.col]||{}; if(op.data) ls[op.col][op.id]=1; else delete ls[op.col][op.id]; return; }
  const arr=ls[op.col]=ls[op.col]||[]; const i=arr.findIndex(x=>x.id===op.id);
  if(op.data){ if(i>=0) arr[i]=op.data; else arr.push(op.data); } else if(i>=0) arr.splice(i,1);
}

}

/* Shows text in an actual on-screen box with a Copy button, since alert()
   text can't be selected/copied on iPhone. Falls back to auto-select
   if the Copy button isn't allowed to touch the clipboard. */
function showCopyBox(title,text){
  const box=document.createElement('div');
  box.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:99999;padding:20px;';
  box.innerHTML=`<div style="background:#fff;color:#111;padding:20px;border-radius:14px;max-width:340px;width:100%;font-family:-apple-system,sans-serif;">
    <div style="font-weight:600;font-size:16px;margin-bottom:10px;">${title}</div>
    <input readonly style="width:100%;box-sizing:border-box;padding:10px;font-size:15px;border:1px solid #ccc;border-radius:8px;margin-bottom:10px;" value="${text}">
    <div style="display:flex;gap:8px;">
      <button id="hqCopyBtn" style="flex:1;padding:10px;border:0;border-radius:8px;background:#222;color:#fff;font-size:15px;">Copy</button>
      <button id="hqCloseBtn" style="flex:1;padding:10px;border:1px solid #ccc;border-radius:8px;background:#fff;color:#111;font-size:15px;">Close</button>
    </div>
  </div>`;
  document.body.appendChild(box);
  const input=box.querySelector('input');
  const copyBtn=box.querySelector('#hqCopyBtn');
  copyBtn.onclick=async()=>{
    input.focus(); input.select(); input.setSelectionRange(0,text.length);
    try{ await navigator.clipboard.writeText(text); copyBtn.textContent='Copied!'; }
    catch(e){ try{ document.execCommand('copy'); copyBtn.textContent='Copied!'; }catch(e2){ copyBtn.textContent='Tap & hold the box above'; } }
  };
  box.querySelector('#hqCloseBtn').onclick=()=>box.remove();
}

    try{ this.pendingFiles=new Set(JSON.parse(await store.get(PENDF_KEY)||'[]')); }catch(e){}
    if(fresh&&this.lastSynced){ this.lastSynced=null; await store.del(SYNC_KEY); }
    if(this.code&&this.hasConfig()){
      if(fresh) LS('hq:intent','join');
      const r=await this.connect(LS('hq:intent')||undefined);
      if(r&&!r.ok&&r.reason) this.abandon(r,fresh);

  },
  /* Called from the Share sheet. intent is 'new' (this phone's list becomes the house) or 'join'
     (this phone takes the house's list). Returns {ok} or {ok:false, note, reason?}. */
  async start(code,intent){
    if(this.status==='loading'||this.status==='connecting') return {ok:false,note:'Still connecting. Give it a moment.'};
    if(this.status==='on'||this.status==='error') await this.disconnect();
    this.code=code; LS('hq:house',code); LS('hq:intent',intent); LS('hq:nocloud',null);
    return this.connect(intent);
  },
  /* A code that turned out to be wrong for what was asked: forget it and put the choice back on screen. */

  mismatch(reason,intent,note){

  async retry(){

  ref(col,id){ const FB=this.FB; return col==='meta'?FB.doc(this.db,'houses',this.code):FB.doc(this.db,'houses',this.code,col,id); },
  colRef(col){ return this.FB.collection(this.db,'houses',this.code,col); },
  async connect(intent){
    if(this.status==='on') return {ok:true};
    if(this.status==='loading'||this.status==='connecting') return {ok:false,note:'Still connecting. Give it a moment.'};

    const FB=await fbReady(12000);
    if(!FB){ this.status='error'; this.err='Could not load the sync service. Working from this phone until it can.'; this.paint(); return {ok:false,note:this.err}; }
    try{
      this.status='connecting'; this.FB=FB;
      const app=FB.getApps().length?FB.getApp():FB.initializeApp(this.config);
      // The app keeps its own copy of every photo and file, so the SDK's cache only needs the small records.
      try{ this.db=FB.initializeFirestore(app,{localCache:FB.persistentLocalCache({cacheSizeBytes:50*1024*1024})}); }
      catch(e){ this.db=FB.getFirestore(app); }
      const _u=await ensureLogin(FB,FB.getAuth(app));
      /* TEMP — copy this UID into your rules, then delete these 3 lines. */
      setTimeout(()=>showCopyBox('Signed in as '+_u.email,_u.uid),1500);
      if(!this.lastSynced){
        const snap=await FB.getDoc(this.ref('meta')), exists=snap.exists();
        // The sheet said which was meant. A code that does not match is refused rather than silently
        // creating a house or wiping this phone's list.
        if(intent==='join'&&!exists) return this.mismatch('missing',intent,'No house has that code yet. Check it on the other phone, or go back and start a new house.');
        if(intent==='new'&&exists) return this.mismatch('taken',intent,'That code is already in use. Join that house instead, or change the code.');
        if(exists){
          // Joining a house that already exists: this phone takes the house's data.
          // Keep what was here first, so joining is never a one-way door. A phone with nothing on it yet has nothing to keep.
          if(touched||!bootFresh){ try{
            const snapshot=JSON.stringify({at:new Date().toISOString(),state:S});
            if(await store.set(PREJOIN_KEY,snapshot)) prejoin=JSON.parse(snapshot);
          }catch(e){} }
          S=emptyShell(S); this.lastSynced=clone(S);
          await store.set(KEY,JSON.stringify(S));
          await store.set(SYNC_KEY,JSON.stringify(this.lastSynced));   // so a reopen before the first pull is not treated as a fresh join
        }else{
          // A brand-new house: what is on this phone becomes the house.
          await this.pushAll();
          await store.set(KEY,JSON.stringify(S));   // and is saved here too, so a reopen never re-seeds over it
        }
      }
      LS('hq:intent',null);
      this.status='on'; this.paint();
      this.listen();
      setTimeout(()=>this.snapshot(),4000);
      this.flushPhotos();
      this.flushFiles();
      this.push();
      return {ok:true};
    }catch(e){ this.status='error'; this.err=friendlyErr(e); oops('connecting',e); this.paint(); return {ok:false,note:this.err}; }
  },
  async pushAll(){
    const {ops,meta}=diffState(S,null);
    await this.commit(ops,meta);
    this.lastSynced=clone(S);
    await store.set(SYNC_KEY,JSON.stringify(this.lastSynced));
    S.photos.forEach(p=>this.pendingPhotos.add(p.id));

  },
  async commit(ops,meta){
    const FB=this.FB; let batch=FB.writeBatch(this.db), n=0;
    const flush=async()=>{ if(n){ await batch.commit(); batch=FB.writeBatch(this.db); n=0; } };
    for(const op of ops){
      const r=this.ref(op.col,op.id);
      if(op.data) batch.set(r,op.data); else batch.delete(r);

  async push(){
    if(this.status!=='on'||erasing) return;

    try{
      const {ops,meta}=diffState(S,this.lastSynced);
      if(ops.length||meta){
        await this.commit(ops,meta);
        for(const op of ops) applyToSynced(this.lastSynced,op);
        if(meta) Object.assign(this.lastSynced,clone(meta));
        await store.set(SYNC_KEY,JSON.stringify(this.lastSynced));

  listen(){

  stopListening(){ for(const u of this.unsubs){ try{ u(); }catch(e){} } this.unsubs=[]; },
  /* Three-way merge per item: anything changed on this phone since the last sync wins here and gets pushed;
     everything else takes the house's version. */
  onCol(col,docs){
    const ls=this.lastSynced;
    if(CHECK_MAPS.includes(col)){
      const server=new Map(docs.map(d=>[d.id,d.data||{}])), prev=new Set(Object.keys(ls[col]||{})), local=S[col]||{}, out={};
      for(const [k,sd] of server){ if(!(k in local)&&prev.has(k)) continue;
        out[k]=local[k]||{at:sd.at||Date.now(),by:sd.by||''}; }
      for(const k in local) if(!server.has(k)&&!prev.has(k)) out[k]=local[k];
      S[col]=out; ls[col]=Object.fromEntries([...server.keys()].map(k=>[k,1]));
    }else{
      const server=new Map(docs.map(d=>[d.id,d.data]));
      const prev=new Map((ls[col]||[]).map(x=>[x.id,JSON.stringify(x)]));
      const local=new Map((S[col]||[]).map(x=>[x.id,x])), out=[];
      for(const [id,sd] of server){
        const l=local.get(id), p=prev.get(id);
        if(!l){ if(!p) out.push(sd); continue; }
        out.push(JSON.stringify(l)!==p?l:sd);
      }
      for(const [id,l] of local) if(!server.has(id)&&!prev.has(id)) out.push(l);
      S[col]=sortCol(col,out); ls[col]=[...server.values()].map(clone);
    }
    this.afterPull();
  },
  onMeta(data){
    const ls=this.lastSynced;
    if(data===null){

      if(ls&&ls.createdAt){ this.houseGone(); return; }
      data={};
    }
    for(const f of META_FIELDS){
      const pending=JSON.stringify(S[f]===undefined?null:S[f])!==JSON.stringify(ls[f]===undefined?null:ls[f]);
      if(!pending&&data[f]!==undefined) S[f]=clone(data[f]);
      if(data[f]!==undefined) ls[f]=clone(data[f]);

    if(!S.closedPhases) S.closedPhases={};

  afterPull(){
    clearTimeout(this.pullT);
    if(erasing) return;
    this.pullT=setTimeout(async()=>{
      this.lastPullAt=Date.now();
      await store.set(KEY,JSON.stringify(S));
      await store.set(SYNC_KEY,JSON.stringify(this.lastSynced));
      const ae=document.activeElement, typing=ae&&/^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName);
      if((modal&&modal.draft)||typing) pendingRender=true; else render();
      this.push();
    },60);
  },
  /* photos: the picture itself lives in its own document, fetched only when shown */
  async photoWritten(id,data){
    if(!this.code) return;
    this.pendingPhotos.add(id); await store.set(PEND_KEY,JSON.stringify([...this.pendingPhotos]));
    this.flushPhotos();
  },
  async flushPhotos(){
    if(this.status!=='on'||!this.pendingPhotos.size) return;
    for(const id of [...this.pendingPhotos]){
      try{
        const data=photoCache[id]||(S.photoData&&S.photoData[id])||await store.get(PKEY(id));
        if(data&&data.length<=PHOTO_MAX) await this.FB.setDoc(this.ref('photodata',id),{d:data});
        this.pendingPhotos.delete(id);
      }catch(e){ this.err=friendlyErr(e); oops('sending a photo',e); break; }
    }
    await store.set(PEND_KEY,JSON.stringify([...this.pendingPhotos]));
  },
  /* files go up in chunks so a big blueprint still fits Firestore's per-document limit */
  async fileWritten(id){
    if(!this.code) return;
    this.pendingFiles.add(id); await store.set(PENDF_KEY,JSON.stringify([...this.pendingFiles]));
    this.flushFiles();
  },
  async flushFiles(){
    if(this.status!=='on'||!this.pendingFiles.size) return;
    for(const id of [...this.pendingFiles]){
      try{
        const raw=fileCache[id]||await store.get(FKEY(id));
        if(!raw){ this.pendingFiles.delete(id); continue; }
        const data=await base64Of(raw);
        const total=Math.ceil(data.length/CHUNK);
        for(let n=0;n<total;n++)
          await this.FB.setDoc(this.ref('filedata',id+'_'+n),{d:data.slice(n*CHUNK,(n+1)*CHUNK),n,total});

        this.pendingFiles.delete(id);

  async fetchFile(id,chunks){

      let out='';
      for(let n=0;n<(chunks||1);n++){
        const s2=await this.FB.getDoc(this.ref('filedata',id+'_'+n));
        if(!s2.exists()) return null;
        out+=s2.data().d;
      }
      let keep=out;
      try{ keep=dataURLtoBlob(out); }catch(e){}
      await store.set(FKEY(id),keep);

    }catch(e){ return null; }
  },
  deleteFile(id,chunks){
    if(this.status!=='on') return;
    for(let n=0;n<(chunks||1);n++){ try{ this.FB.deleteDoc(this.ref('filedata',id+'_'+n)); }catch(e){} }
  },
  async fetchPhoto(id){
    if(this.status!=='on') return null;
    try{ const s=await this.FB.getDoc(this.ref('photodata',id)); const d=s.exists()?s.data().d:null;

  deletePhoto(id){ if(this.status==='on'){ try{ this.FB.deleteDoc(this.ref('photodata',id)); }catch(e){} } },
  /* Once a week the whole house (minus the pictures themselves) is written to
     one document, and the last eight are kept. A bad merge or a fat-fingered
     mass delete is then a restore, not a loss. */
  async snapshot(force){
    if(this.status!=='on') return false;
    const wk=weekKey(new Date());
    if(!force&&LS('hq:snap')===wk) return false;
    try{
      const state={...S}; delete state.photoData;
      const d=JSON.stringify(state);
      if(d.length>950000) return false;
      await this.FB.setDoc(this.ref('snapshots',wk),{at:new Date().toISOString(),by:pref.who(),n:S.tasks.length+S.yearly.length+S.logs.length,d});
      LS('hq:snap',wk);
      const list=await this.listSnapshots(true);
      for(const old of list.slice(8)){ try{ await this.FB.deleteDoc(this.ref('snapshots',old.id)); }catch(e){} }

    }catch(e){ oops('weekly copy',e); return false; }
  },
  async listSnapshots(idsOnly){
    const snap=await this.FB.getDocs(this.colRef('snapshots'));
    return snap.docs.map(x=>{ const v=x.data()||{}; return idsOnly?{id:x.id,at:v.at||''}:{id:x.id,at:v.at||'',by:v.by||'',n:v.n||0,size:(v.d||'').length,d:v.d||''}; })
      .sort((a,b)=>(b.at||'').localeCompare(a.at||''));
  },
  async disconnect(){
    this.stopListening(); clearTimeout(this.pullT);
    this.status='off'; this.code=''; this.lastSynced=null; this.err='';
    LS('hq:house',null); LS('hq:intent',null); LS('hq:nocloud','1'); await store.del(SYNC_KEY);
    this.paint();
  },
  async houseGone(){
    await this.disconnect();
    setNote('This house was deleted from the other phone, so sharing has stopped here. Whatever is still on this phone is kept.');
    render();
  },
  /* Removes the whole house from the cloud: every record, the pictures and files, the weekly copies, then the
     house itself. The other phone sees everything vanish and stops sharing. Listeners are stopped first so
     nothing here is pushed back up while it is being cleared. */
  async eraseHouse(){
    const FB=this.FB; if(!FB||!this.db||!this.code) throw new Error('not connected');
    this.stopListening(); clearTimeout(this.pullT);
    const del=async refs=>{
      let batch=FB.writeBatch(this.db), n=0;
      for(const r of refs){ batch.delete(r); if(++n>=400){ await batch.commit(); batch=FB.writeBatch(this.db); n=0; } }
      if(n) await batch.commit();
    };
    for(const col of [...SHARED_COLS,...CHECK_MAPS,'snapshots']){
      const snap=await FB.getDocs(this.colRef(col)); await del(snap.docs.map(d=>d.ref));
    }
    // pictures and file chunks are deleted by id so the bytes are not downloaded just to be thrown away
    await del((S.photos||[]).map(p=>this.ref('photodata',p.id)));
    const fr=[]; for(const f of (S.files||[])) for(let n=0;n<(f.chunks||1);n++) fr.push(this.ref('filedata',f.id+'_'+n));
    await del(fr);
    await FB.deleteDoc(this.ref('meta'));
  },
  describe(){
    if(!this.code) return 'Just this phone. Nothing is shared.';
    if(this.status==='on'&&!online()) return 'No signal right now. Everything you change is saved here and goes to the house the moment the phone is back on.';
    if(this.status==='on') return 'Sharing is live. Changes reach the other phones within a second or two, and pile up here when there is no signal.';
    if(this.status==='loading'||this.status==='connecting') return 'Connecting…';
    if(this.status==='error') return 'Not connected: '+this.err+' Everything is still saved on this phone and will sync when it connects.';
    return 'Not connected yet.';
  },

};
window.addEventListener('online',()=>{ render(); if(cloud.status==='on'){ cloud.push(); cloud.flushPhotos(); cloud.flushFiles(); } });
window.addEventListener('offline',()=>render());
document.addEventListener('focusout',()=>{ if(pendingRender&&!(modal&&modal.draft)){ pendingRender=false; setTimeout(render,80); } });

/* ============================================================
   Attachments — spreadsheets, blueprints, PDFs, anything
   The file itself lives on the phone. When sharing is on it is also
   split into chunks in Firestore so the other phone can pull it down.
   An entry can instead be just a web link (a Google Sheet, say).
============================================================ */
const FKEY=id=>'hqfile:'+id;
const FILE_MAX=200*1024*1024;         // what the phone will hold
const SHARE_MAX=20*1024*1024;         // past this it stays on this phone rather than syncing
const CHUNK=700000;                   // stays inside Firestore's 1 MB document limit
const FILE_CATS=['Plans','Budget','Papers'];
const fileCache={};
const prettySize=n=>n>=1048576?(n/1048576).toFixed(1)+' MB':Math.max(1,Math.round(n/1024))+' KB';
const isSheet=f=>/sheet|excel|csv|numbers/i.test(f.type||'')||/\.(xlsx?|xlsm|csv|numbers)$/i.test(f.name||'');
const fileIcon=f=>f.url&&!f.stored?I.link:isSheet(f)?I.grid:/pdf/i.test(f.type||'')||/\.pdf$/i.test(f.name||'')?I.doc:/^image\//.test(f.type||'')?I.img:I.paper;

/* A web address typed without the https:// still has to work as a link. */
function fixURL(u){
  const v=String(u||'').trim();
  if(!v) return '';
  if(/^(https?|mailto|tel):/i.test(v)) return v;
  if(/^[a-z][a-z0-9+.-]*:/i.test(v)) return '';   // javascript:, data: and friends are not links
  return 'https://'+v;
}
function readFile(file){
  return new Promise((res,rej)=>{
    const r=new FileReader();
    r.onload=()=>res(r.result);
    r.onerror=()=>rej(new Error('could not read the file'));
    r.readAsDataURL(file);
  });
}
const blobOf=v=>v instanceof Blob?v:dataURLtoBlob(v);
async function base64Of(v){
  const d=v instanceof Blob?await readFile(v):v;
  return String(d);
}
async function freeSpace(){
  try{ const e=await navigator.storage.estimate(); return (e.quota||0)-(e.usage||0); }catch(e){ return null; }
}
async function addFile(file,meta){
  if(file.size>FILE_MAX){ setNote(`That file is ${prettySize(file.size)}, past the ${prettySize(FILE_MAX)} limit.`); return null; }
  const free=await freeSpace();
  if(free!==null&&free<file.size*1.4){
    setNote(`Not enough room left on this phone for ${prettySize(file.size)} — about ${prettySize(Math.max(0,free))} free. Delete a photo or file and try again.`);
    return null;
  }
  const id=uid();
  // A Blob goes straight into IndexedDB. Other storage modes need text, so fall back to base64.
  let payload=file, data=null;
  if(store.mode!=='idb'){
    try{ data=await readFile(file); payload=data; }
    catch(e){ setNote('Could not read that file.'); return null; }
  }
  let ok=false;
  try{ ok=await store.set(FKEY(id),payload); }catch(e){ ok=false; }
  if(!ok&&store.mode==='idb'){
    try{ data=await readFile(file); ok=await store.set(FKEY(id),data); payload=data; }catch(e){ ok=false; }
  }
  if(!ok){
    setNote(`${prettySize(file.size)} was too much for this browser to store.`+(store.mode==='artifact'?' Open the app from your home screen instead of inside Claude and it will handle far bigger files.':''));
    return null;
  }
  fileCache[id]=payload;
  const rec={id,name:file.name||'Untitled',type:file.type||'',size:file.size,
    cat:meta.cat||'Papers',note:meta.note||'',url:'',stored:true,
    shared:file.size<=SHARE_MAX,
    chunks:Math.ceil((file.size*4/3+64)/CHUNK),
    addedAt:new Date().toISOString().slice(0,16).replace('T',' ')};
  S.files.unshift(rec);
  await save();
  if(rec.shared) cloud.fileWritten(id);
  else if(cloud.code) setNote(`${rec.name} is saved here, but it is too big to sync — it stays on this phone.`);
  return rec;
}
async function getFileData(id){
  if(fileCache[id]!==undefined&&fileCache[id]!==null) return fileCache[id];
  let d=await store.get(FKEY(id));
  if(!d){ const f=S.files.find(x=>x.id===id); d=await cloud.fetchFile(id,f&&f.chunks); }
  fileCache[id]=d||null;
  return d;
}
function dataURLtoBlob(d){
  const [head,b64]=String(d).split(',');
  const type=(/data:([^;]+)/.exec(head)||[])[1]||'application/octet-stream';
  const bin=atob(b64||''); const arr=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
  return new Blob([arr],{type});
}
/* Tapping a file opens it here in the app. Handing it to another app is the
   button in the top corner of the viewer. */
async function openFile(id){
  const f=S.files.find(x=>x.id===id); if(!f) return;
  if(f.url&&!f.stored){
    const em=embedURL(f.url);
    if(!em){ const u=fixURL(f.url); if(u) window.open(u,'_blank','noopener'); return; }
    modalAt=Date.now(); modal={kind:'fileview',id,link:true,src:em}; render(); return;
  }
  modalAt=Date.now(); modal={kind:'fileview',id}; render();
}
/* Hand the file to whatever app the phone uses for it. */
async function downloadFile(id){
  const f=S.files.find(x=>x.id===id); if(!f) return;
  if(f.url&&!f.stored){ const u=fixURL(f.url); if(u) window.open(u,'_blank','noopener'); return; }
  setNote('Opening '+f.name+'…','ok');
  const d=await getFileData(id);
  if(!d){ setNote(f.shared===false?'This file only exists on the phone it was added from.':'That file is not on this phone yet. Open it once where it was added, or check the connection.'); return; }
  setNote('');
  try{
    const blob=blobOf(d), url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url; a.download=f.name; a.rel='noopener';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),60000);
  }catch(e){ setNote('This browser would not open that file.'); }
}
function fileRow(f){
  return `<div class="row">
    <button class="fico" data-act="openfile" data-id="${f.id}" aria-label="Open">${fileIcon(f)}</button>
    <button class="body" data-act="openfile" data-id="${f.id}">
      <div class="t">${esc(f.name)}</div>

/* ---------- what went wrong, kept where you can see it ---------- */
const diag={errors:[]};
function oops(where,e){
  const msg=(e&&(e.message||e.code))||String(e||'unknown');
  diag.errors.unshift({at:Date.now(),where,msg}); diag.errors.length=Math.min(diag.errors.length,6);
}
function ago(ts){
  if(!ts) return 'never';
  const s=Math.round((Date.now()-ts)/1000);
  if(s<45) return 'just now';
  if(s<3600) return Math.round(s/60)+' min ago';
  if(s<86400) return Math.round(s/3600)+' hour'+(s<7200?'':'s')+' ago';
  if(s<86400*7) return Math.round(s/86400)+' day'+(s<172800?'':'s')+' ago';
  return fmtDate(isoOf(new Date(ts)));
}
function diagnosticsHTML(){
  if(!cloud.code) return '';
  let waiting=0; try{ waiting=diffState(S,cloud.lastSynced).ops.length; }catch(e){}
  const last=diag.errors[0];
  return `<dl class="kv" style="margin:12px 0 4px">
    <dt>Last sent</dt><dd>${esc(ago(cloud.lastPushAt))}</dd>
    <dt>Last received</dt><dd>${esc(ago(cloud.lastPullAt))}</dd>
    <dt>Waiting to go</dt><dd>${waiting?waiting+' change'+(waiting===1?'':'s'):'nothing'}${cloud.pendingPhotos.size?', '+cloud.pendingPhotos.size+' photo'+(cloud.pendingPhotos.size===1?'':'s'):''}${cloud.pendingFiles.size?', '+cloud.pendingFiles.size+' file'+(cloud.pendingFiles.size===1?'':'s'):''}</dd>
    <dt>Last problem</dt><dd>${last?esc(ago(last.at)+' — '+last.where+': '+last.msg):'none this session'}</dd>
  </dl>`;
}

/* ---------- dates ---------- */
function weekKey(d){
  const x=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));
  const day=x.getUTCDay()||7; x.setUTCDate(x.getUTCDate()+4-day);
  const y0=new Date(Date.UTC(x.getUTCFullYear(),0,1));
  return x.getUTCFullYear()+'-w'+String(Math.ceil(((x-y0)/DAY+1)/7)).padStart(2,'0');
}
const DAY=864e5;
const today0=()=>{ const d=new Date(); d.setHours(0,0,0,0); return d; };
const parseDate=v=>{ const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(String(v||'')); return m?new Date(+m[1],+m[2]-1,+m[3]):null; };
const isoOf=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const addMonths=(d,n)=>{ const x=new Date(d.getFullYear(),d.getMonth()+n,1);
  x.setDate(Math.min(d.getDate(), new Date(x.getFullYear(),x.getMonth()+1,0).getDate())); return x; };
/* A repeating date rolls forward until it is ahead of today. A one-off stays put. */
function nextOccur(kd){
  let d=parseDate(kd&&kd.date); if(!d) return null;
  const every=+((kd&&kd.every)||0);
  if(every>0){ const t=today0(); let guard=0;
    while(d<t&&guard++<200) d=new Date(d.getFullYear()+every,d.getMonth(),d.getDate()); }
  return d;
}
const daysAway=d=>Math.round((d-today0())/DAY);
function countdown(d){
  if(!d) return '';
  const n=daysAway(d);
  if(n===0) return 'today';
  if(n===1) return 'tomorrow';
  if(n===-1) return 'yesterday';
  if(n<0) return Math.abs(n)+' days ago';
  if(n<46) return 'in '+n+' days';
  const mo=Math.round(n/30.4);
  return mo<18?'in about '+mo+' months':'in about '+Math.round(n/365)+' years';
}
const repeatWord=n=>!+n?'once':+n===1?'every year':'every '+n+' years';
function datedKeyDates(){
  return (S.keyDates||[]).filter(k=>k.date).map(k=>({...k,when:nextOccur(k)}))
    .filter(k=>k.when).sort((a,b)=>a.when-b.when);
}

/* ---------- who to call ---------- */
const contactOf=o=>(o&&o.contactId)?(S.contacts||[]).find(c=>c.id===o.contactId):null;
function contactPick(d){

  return `<label class="lbl">Who to call<select data-m="contactId"><option value="">Nobody yet</option>${
    S.contacts.map(c=>`<option value="${c.id}" ${d.contactId===c.id?'selected':''}>${esc(c.name||'Unnamed')}</option>`).join('')
  }</select></label>`;

function callRow(o){

/* ---------- recent changes, from the name stamps ---------- */
const stampMs=v=>{ if(!v) return 0; if(typeof v==='number') return v; const t=Date.parse(String(v).replace(' ','T')); return isNaN(t)?0:t; };
function recentChanges(n){
  const out=[]; const push=(at,by,what)=>{ at=stampMs(at); if(at&&what) out.push({at,by:by||'',what}); };
  for(const k in (S.yearlyDone||{})){ const t=tickInfo(S.yearlyDone[k]); const x=(S.yearly||[]).find(y=>k.startsWith(y.id+':'));
    if(x) push(t.at,t.by,'ticked '+x.title); }
  for(const k in (S.equipDone||{})){ const t=tickInfo(S.equipDone[k]); const [eid,cid]=k.split(':');
    const e=(S.equipment||[]).find(z=>z.id===eid), c=e&&e.checks.find(z=>z.id===cid);
    if(c) push(t.at,t.by,'ticked '+c.title+' on the '+e.name.toLowerCase()); }
  (S.tasks||[]).forEach(t=>{ if(t.done&&t.doneAt) push(t.doneAt,t.doneBy,'finished '+t.title); });
  (S.logs||[]).forEach(l=>push(l.at||l.date,l.who,'recorded '+(l.subject||'a service')));
  (S.photos||[]).forEach(p=>push(p.uploadedAt||p.addedAt,p.by,'added a photo'+(p.caption?' of '+p.caption:'')));
  (S.readings||[]).forEach(r=>push(r.at,r.by,'logged '+r.metric+(String(r.value).trim()?' at '+r.value:'')));
  (S.fuel||[]).forEach(f=>push(f.at,f.by,'logged a fuel delivery'+(f.gallons?' of '+f.gallons+' gallons':'')));
  (S.keyDates||[]).forEach(k=>push(k.at,k.by,'set the date for '+k.title));
  return out.sort((a,b)=>b.at-a.at).slice(0,n||10);
}

/* ---------- who did it ---------- */
const tick=()=>({at:Date.now(),by:pref.who()});
const tickInfo=v=>(v&&typeof v==='object')?{at:v.at||0,by:v.by||''}:{at:+v||0,by:''};
function tickWords(v){
  const t=tickInfo(v); if(!t.at&&!t.by) return '';
  const when=t.at?fmtDate(isoOf(new Date(t.at))):'';
  return [t.by,when].filter(Boolean).join(', ');
}

/* ---------- derived ---------- */
const yearKey=(id,y)=>id+':'+y;
const isClosed=p=>!!(S.closedPhases&&S.closedPhases[p]);
const activePhases=()=>PHASES.filter(p=>!isClosed(p));
const visibleTasks=()=>S.tasks.filter(t=>!isClosed(t.when));
// The setup checklist is a one-time job. Once every stage that has items is closed out, its tab goes away.
const setupOpen=()=>S.tasks.some(t=>!isClosed(t.when));
const closedList=()=>Object.keys(S.closedPhases||{}).filter(p=>S.tasks.some(t=>t.when===p));
/* "Every 3 years" style items are only due in the year they come round. */
function freqInfo(freq){
  const f=(freq||'').toLowerCase(); let m;
  if((m=f.match(/every\s+(\d+)\s*(year|yr)/))) return {years:+m[1]};
  if(/every other year|biennial/.test(f)) return {years:2};
  if((m=f.match(/every\s+(\d+)\s*month/))) return {months:+m[1]};
  if(/quarter/.test(f)) return {months:3};
  if(/month/.test(f)) return {months:1};
  if(/week/.test(f)) return {weeks:1};
  return {years:1};
}
/* A done-mark is keyed id:year for anything yearly or longer — unchanged, so
   everything ticked before still reads. Quarterly and monthly items add the
   period: id:year:month, one tick for each time they come round. */
function occPeriod(x){
  const fi=freqInfo(x.freq);
  if(fi.months) return Math.max(1,Math.min(12,fi.months));
  if(fi.weeks) return 1;
  return 0;                       // 0 means once a year
}
function occurrences(x,y){
  const n=occPeriod(x);
  if(!n) return [{key:yearKey(x.id,y),month:+x.month||0,label:''}];
  const out=[], start=((+x.month||1)-1)%n;
  for(let m=start;m<12;m+=n) out.push({key:x.id+':'+y+':'+m,month:m+1,label:MONTHS[m]});
  return out;
}
const occDone=o=>!!(o&&S.yearlyDone[o.key]);
/* The one you would tick today. In a past year, the last of that year. */
function currentOcc(x,y){
  const os=occurrences(x,y);
  if(os.length===1) return os[0];
  const now=new Date().getFullYear();
  if(y<now) return os[os.length-1];
  if(y>now) return os[0];
  const m=new Date().getMonth()+1;
  let cur=os[0];
  for(const o of os) if(o.month<=m) cur=o;
  return cur;
}
/* Periods that have already come round, for counting what is outstanding. */
function occStarted(x,y){
  const os=occurrences(x,y);
  if(os.length===1) return os;
  const now=new Date();
  if(y<now.getFullYear()) return os;
  if(y>now.getFullYear()) return [];
  const m=now.getMonth()+1;
  return os.filter(o=>o.month<=m);
}
function doneYears(id){
  return Object.keys(S.yearlyDone).filter(k=>k.startsWith(id+':'))
    .map(k=>+k.split(':')[1]).filter(v=>v);
}
function lastDoneBefore(id,y){
  const ys=doneYears(id).filter(v=>v<y);
  return ys.length?Math.max(...ys):null;
}
function nextDueYear(x,y){
  const fi=freqInfo(x.freq); if(!fi.years||fi.years<2) return null;
  const last=lastDoneBefore(x.id,y); return last?last+fi.years:null;
}
const dueInYear=(x,y)=>{ if(occurrences(x,y).some(occDone)) return true; const n=nextDueYear(x,y); return n===null||n<=y; };
const seasonalDone=y=>S.yearly.reduce((n,x)=>n+(dueInYear(x,y)?occurrences(x,y).filter(occDone).length:0),0);
const seasonalTotal=y=>S.yearly.reduce((n,x)=>n+(dueInYear(x,y)?occStarted(x,y).length:0),0);
function completePhases(){
  return activePhases().filter(p=>{
    const r=S.tasks.filter(t=>t.when===p);
    return r.length && r.every(t=>t.done);
  });
}
function yearsTouched(){
  const set=new Set([S.activeYear,new Date().getFullYear()]);
  Object.keys(S.yearlyDone).forEach(k=>set.add(+k.split(':')[1]));
  Object.keys(S.equipDone).forEach(k=>set.add(+k.split(':').pop()));
  return [...set].sort((a,b)=>a-b);
}
function lastDoneYear(id){
  const ys=doneYears(id);
  return ys.length?Math.max(...ys):null;
}

/* ============================================================
   Drawing the screen
   Views are still built as one string. Instead of replacing the whole tab,
   the string is parsed and the live DOM is patched to match, so scroll
   position, focus and the cursor in a field survive a re-draw, and the
   phone does far less work per keystroke. If anything about that goes
   wrong the old full replace is used for that draw.
============================================================ */
const CAN_MORPH=(()=>{ try{ return 'content' in document.createElement('template'); }catch(e){ return false; } })();
function keyOf(el){
  if(!el||el.nodeType!==1) return '';
  const d=el.dataset||{};
  const parts=[el.id||'',d.act||'',d.id||'',d.k||'',d.cid||'',d.sid||'',d.v||'',d.f||'',d.m||'',d.side||''];
  if(parts.some(Boolean)) return el.tagName+'|'+parts.join('|');
  // a plain wrapper such as a row takes its identity from the first keyed thing inside it
  for(const c of el.childNodes){ if(c.nodeType===1){ const k=keyOf(c); return k?el.tagName+'>'+k:''; } }
  return '';
}
/* Returns whichever node is in the tree afterwards: usually `from`, patched; sometimes a fresh copy. */
function morphNode(from,to){
  if(from.nodeType!==1||to.nodeType!==1||from.tagName!==to.tagName){ const c=to.cloneNode(true); from.replaceWith(c); return c; }
  const tag=from.tagName;
  if(tag==='svg'||tag==='SVG'){ if(from.outerHTML!==to.outerHTML){ const c=to.cloneNode(true); from.replaceWith(c); return c; } return from; }
  for(let i=from.attributes.length-1;i>=0;i--){ const a=from.attributes[i].name; if(!to.hasAttribute(a)) from.removeAttribute(a); }
  for(let i=0;i<to.attributes.length;i++){ const a=to.attributes[i]; if(from.getAttribute(a.name)!==a.value) from.setAttribute(a.name,a.value); }
  const focused=document.activeElement===from;
  if(tag==='INPUT'){
    if(!focused){ const v=to.getAttribute('value')||''; if(from.value!==v) from.value=v;
      if(from.type==='checkbox'||from.type==='radio') from.checked=to.hasAttribute('checked'); }
    return from;
  }
  if(tag==='TEXTAREA'){ if(!focused){ const v=to.textContent; if(from.value!==v) from.value=v; } return from; }
  if(tag==='IFRAME'||tag==='CANVAS'||tag==='VIDEO') return from;
  morphChildren(from,to);
  if(tag==='SELECT'&&!focused){ const v=to.value; if(from.value!==v) from.value=v; }
  return from;
}
function morphChildren(from,to){
  const news=[...to.childNodes];
  const keyed=new Map();
  for(const o of from.childNodes){ const k=keyOf(o); if(k){ if(!keyed.has(k)) keyed.set(k,[]); keyed.get(k).push(o); } }
  const used=new Set();
  for(let i=0;i<news.length;i++){
    const n=news[i], cur=from.childNodes[i];     // everything before i is settled, so cur is the next unsettled old node
    let match=null;
    if(n.nodeType===3){
      if(cur&&cur.nodeType===3&&!used.has(cur)){ match=cur; if(cur.nodeValue!==n.nodeValue) cur.nodeValue=n.nodeValue; }
    }else if(n.nodeType===1){
      const k=keyOf(n);
      if(k&&keyed.has(k)){ const list=keyed.get(k); while(list.length&&used.has(list[0])) list.shift(); if(list.length) match=list.shift(); }
      if(!match&&cur&&cur.nodeType===1&&!used.has(cur)&&cur.tagName===n.tagName&&!keyOf(cur)) match=cur;
      if(match) match=morphNode(match,n);
    }
    if(!match) match=n.cloneNode(true);
    used.add(match);
    if(from.childNodes[i]!==match) from.insertBefore(match,from.childNodes[i]||null);
  }
  while(from.childNodes.length>news.length) from.removeChild(from.lastChild);
}
function setHTML(el,html){
  if(!CAN_MORPH){ el.innerHTML=html; return; }
  try{ const t=document.createElement('template'); t.innerHTML=html; morphChildren(el,t.content); }
  catch(e){ oops('drawing the screen',e); el.innerHTML=html; }
}

let themedAs=null;
function applyTheme(){
  document.documentElement.style.zoom=pref.big()?'1.15':'';
  const key=effectiveTheme();
  if(themedAs===key) return;          // rewriting all the CSS on every keystroke is what made typing lag
  themedAs=key;
  const t=THEMES[key]||THEMES.concrete;
  document.getElementById('sty').textContent=CSS(t);
  for(const k in t) if(k!=='label') document.documentElement.style.setProperty('--'+k,t[k]);
  const cs = key==='midnight' ? 'dark' : 'light';
  document.documentElement.style.colorScheme=cs;
  const m=document.querySelector('meta[name="color-scheme"]');
  if(m) m.content=cs;
  const tc=document.getElementById('themecolor');
  if(tc) tc.content=t.paper;
}

function renderHeader(){
  const setup=setupOpen();
  let done,total;
  if(setup){ const vis=visibleTasks(); done=vis.filter(t=>t.done).length; total=vis.length; }
  else { done=seasonalDone(S.activeYear); total=seasonalTotal(S.activeYear); }
  document.getElementById('hname').textContent=S.propertyName||'House HQ';
  const tabLabel=tab==='settings'?'Settings':(TABS.find(([k])=>k===tab)||[])[1]||'';
  const gb=document.getElementById('gearbtn'); gb.innerHTML=tab==='settings'?I.x:I.cog; gb.className='icb'+(tab==='settings'?' on':'');
  gb.setAttribute('aria-label',tab==='settings'?'Close settings':'Settings');
  document.getElementById('hsub').textContent=tabLabel+(!online()&&cloud.code?' · offline, changes queued':!online()?' · offline':'');
  document.getElementById('hdone').textContent=done;
  document.getElementById('htotal').textContent='of '+total;
  const ticks=Math.max(Math.min(total,58),1), fill=Math.round(done/Math.max(total,1)*ticks);
  document.getElementById('gauge').innerHTML=Array.from({length:ticks},(_,i)=>
    `<i class="${i<fill?'on':''}" style="height:${i%5===0?22:12}px"></i>`).join('');
  const cur=currentSeason(), y=S.activeYear;
  document.getElementById('seasons').innerHTML=tab!=='seasons'?'':SEASONS.map(([n])=>{
    const rows=S.yearly.filter(x=>x.season===n&&dueInYear(x,y));
    const total=rows.reduce((a,x)=>a+occStarted(x,y).length,0);
    const d=rows.reduce((a,x)=>a+occurrences(x,y).filter(occDone).length,0);
    return `<button class="${n===seasonSel?'on':''} ${n===cur?'now':''}" data-act="pickseason" data-v="${n}" aria-pressed="${n===seasonSel}">${n}<small>${total?d+'/'+total:'—'}</small></button>`;
  }).join('');
}

function checkbox(on,act,data,label){
  const what=(label||'').trim()||'this item';
  return `<button class="box ${on?'on':''}" data-act="${act}" ${data} role="checkbox" aria-checked="${!!on}" aria-label="${esc(what)}">${on?I.check:''}</button>`;
}
function stripHTML(ids){
  if(!ids||!ids.length) return '';
  return `<div class="strip">${ids.map(id=>{
    const src=thumbOf(id);
    return `<button data-act="viewphoto" data-id="${id}">${src?`<img src="${src}" alt="">`:I.img}</button>`;
  }).join('')}</div>`;
}
function logHTML(logs,showSubject){
  if(!logs.length) return '';
  return `<div class="log">${logs.map(l=>`<div class="e">
    <div class="d">${esc(l.date)}${l.who?`<em>${esc(l.who)}</em>`:''}
      <button class="icb" style="margin-left:auto" data-act="dellog" data-id="${l.id}">${I.trash}</button></div>
    ${showSubject?`<div class="w"><b>${esc(l.subject)}</b></div>`:''}
    ${l.what?`<div class="w">${esc(l.what)}</div>`:''}
    ${(l.cost||l.doc)?`<div class="meta">${l.cost?'$'+esc(l.cost):''}${l.cost&&l.doc?' · ':''}${l.doc?esc(l.doc):''}</div>`:''}
    ${stripHTML(l.photos)}</div>`).join('')}</div>`;
}

/* ---------- Search, across the whole house ---------- */
function searchBar(ph){
  return `<div style="display:flex;gap:8px;margin-bottom:10px">
    <input id="q" placeholder="${ph||'Search everything'}" value="${esc(q)}">
    ${q?`<button class="btn" style="width:50px;flex:0 0 50px;padding:0" data-act="clearq" aria-label="Clear the search">${I.x}</button>`:''}
  </div>`;
}
function searchAll(ql){
  const has=(...parts)=>parts.filter(Boolean).join(' ').toLowerCase().includes(ql);
  const out=[];
  const add=(group,title,meta,act,id,v)=>out.push({group,title,meta,act,id,v});
  (S.tasks||[]).forEach(t=>{ if(has(t.title,t.cat,t.notes,t.when,t.contact))
    add(isClosed(t.when)?'Setup, closed out':'Setup',t.title,[t.when,t.cat,t.done?'done':''],'detail',t.id); });
  (S.yearly||[]).forEach(x=>{ if(has(x.title,x.cat,x.notes,x.freq,x.season))
    add('Seasonal',x.title,[x.season,x.freq,x.cat],'yeardetail',x.id); });
  (S.logs||[]).forEach(l=>{ if(has(l.subject,l.what,l.who,l.doc,l.cost))
    add('Service records',l.subject||'Record',[fmtDate(l.date),l.who,l.what],'jump',l.refId||''); });
  (S.photos||[]).forEach(p=>{ if(has(p.caption,p.where,p.note))
    add('Photos',p.caption||'Not named yet',[p.where,fmtDate(p.addedAt)],'viewphoto',p.id); });
  (S.contacts||[]).forEach(c=>{ if(has(c.name,c.role,c.note,c.phone))
    add('Contacts',c.name,[c.role,c.phone,c.note],'contact',c.id); });
  (S.equipment||[]).forEach(e=>{
    const parts=(e.specs||[]).map(sp=>sp.k+' '+sp.v).join(' ');
    const checks=(e.checks||[]).map(c=>c.title).join(' ');
    if(has(e.name,e.make,e.model,e.serial,parts,checks))
      add('Equipment',e.name,[[e.make,e.model].filter(Boolean).join(' '),e.serial],'equipjump','',e.id);
  });
  (S.specs||[]).forEach(sp=>{ if(has(sp.k,sp.v))
    add('Sizes',sp.k||'Unnamed',[sp.v],'tab','', 'house'); });
  (S.files||[]).forEach(f=>{ if(has(f.name,f.note,f.cat))
    add('Files',f.name,[f.cat,f.note],'openfile',f.id); });
  (S.keyDates||[]).forEach(k=>{ if(has(k.title,k.note)){
    const w=nextOccur(k); add('Key dates',k.title,[w?fmtDate(isoOf(w)):'no date',w?countdown(w):''],'keydate',k.id); } });
  readingGroups().forEach(g=>{ if(has(g.name,g.rows.map(r=>r.value+' '+r.note).join(' ')))
    add('Readings',g.name,[g.rows.length+' readings','latest '+g.rows[0].value],'metric','',g.key); });
  (S.fuel||[]).forEach(f=>{ if(has(f.vendor,f.note,f.date))
    add('Fuel',fmtDate(f.date),[f.gallons?f.gallons+' gal':'',f.vendor,f.note],'fuel',f.id); });
  (S.budget||[]).forEach(l=>{ if(has(l.name))
    add('Budget',l.name,[money(lineSpent(l,S.activeYear))+' in '+S.activeYear],'line',l.id); });
  (S.buy||[]).forEach(b=>{ if(has(b.title,b.note))
    add('Things to buy',b.title,[b.bought?'bought '+fmtDate(b.bought):'not bought yet',b.note],'buyedit',b.id); });
  return out;
}
function viewSearch(){
  const ql=q.trim().toLowerCase(), R=searchAll(ql);
  const groups=[...new Set(R.map(r=>r.group))];
  return `${searchBar()}
  <p class="hint">${R.length?`${R.length} match${R.length===1?'':'es'} for “${esc(q)}”.`:`Nothing matches “${esc(q)}”.`}</p>
  ${groups.map(g=>{ const rows=R.filter(r=>r.group===g);
    return `<section class="grp"><h3>${esc(g)}<span>${rows.length}</span></h3>
    ${rows.map(r=>`<div class="row">
      <button class="body" data-act="${r.act}" ${r.id?`data-id="${esc(r.id)}"`:''} ${r.v?`data-v="${esc(r.v)}"`:''}>
        <div class="t">${esc(r.title||'Untitled')}</div>
        <div class="m">${(r.meta||[]).filter(Boolean).map(esc).join(' · ')}</div></button>
    </div>`).join('')}</section>`; }).join('')}`;
}

/* ---------- All items ---------- */
function viewList(){
  const rows=visibleTasks().filter(t=>{
    const okP=filter==='All'||t.when===filter;
    const ql=q.trim().toLowerCase();
    return okP && (!ql||(t.title+t.cat+t.notes).toLowerCase().includes(ql));
  });
  const groups={}; rows.forEach(t=>(groups[t.when]=groups[t.when]||[]).push(t));

  const ready=completePhases();
  let banner='';
  if(ready.length){
    banner=`<div class="banner">
      <b>${ready.length===1?esc(ready[0])+' is fully checked.':'Some stages are fully checked.'}</b>
      <p>Close a stage out and it drops off the list and the filters. Bring it back any time from the House tab.</p>
      <div class="btns">${ready.map(p=>
        `<button class="btn" data-act="closeout" data-v="${esc(p)}">${I.check} Close out ${esc(p)}</button>`).join('')}</div>
    </div>`;
  }

  return `${banner}
  <div style="display:flex;gap:8px;margin-bottom:10px">
    <input id="q" placeholder="Search everything" value="${esc(q)}">
    <button class="btn dark" style="width:50px;flex:0 0 50px;padding:0" data-act="newtask" aria-label="Add an item">${I.plus}</button>
    <button class="btn editbtn ${editing?'on':''}" data-act="edit">${editing?'Done':'Edit'}</button>
  </div>
  <button class="btn dash" style="margin-bottom:14px" data-act="snap">${I.cam} Take or add a photo to look at later</button>
  <div class="chips">${['All',...activePhases()].map(p=>
    `<button class="chip ${filter===p?'on':''}" data-act="filter" data-v="${esc(p)}">${esc(p)}</button>`).join('')}</div>
  ${rows.length?'':'<p class="hint">Nothing matches. Clear the search, or add it as a new item.</p>'}
  ${activePhases().filter(p=>groups[p]).map(p=>`
    <section class="grp"><h3>${esc(p)}<span>${groups[p].filter(t=>!t.done).length} open</span></h3>
    ${groups[p].map(t=>`<div class="row ${t.done?'done':''}">
      ${checkbox(t.done,'toggletask','data-id="'+t.id+'"',t.title)}
      <button class="body" data-act="detail" data-id="${t.id}">
        <div class="t">${esc(t.title||'Untitled')}</div>
        <div class="m">${esc(t.cat)}${t.done&&t.doneBy?`<span>${esc(t.doneBy)}</span>`:''}${t.photos&&t.photos.length?`<span>${I.cam} ${t.photos.length}</span>`:''}${S.logs.some(l=>l.refId===t.id)?`<span>${I.doc} logged</span>`:''}</div>
      </button>

  if(isCurrent){

      }).join('')}</div></div>`;
  })()}
  ${due}
  ${(()=>{
    const [name,ms,range]=SEASONS.find(([n])=>n===seasonSel)||SEASONS[0];

function yearRow(x,y,showSeason){
  const os=occurrences(x,y), sub=os.length>1, o=currentOcc(x,y);
  const on=occDone(o), done=os.filter(occDone).length;
  const next=nextDueYear(x,y), notDue=!on&&next!==null&&next>y;
  const last=lastDoneBefore(x.id,y);
  const meta=notDue
    ? [`done ${last}`,`next due ${next}`]
    : [showSeason?x.season:'',x.cat,x.freq,
       sub?`${done} of ${os.length} in ${y}${o.label?', '+o.label+' now':''}`:(x.month?MONTHS[x.month-1]:''),
       on?tickInfo(S.yearlyDone[o.key]).by:'',
       last&&!on?'last done '+last:''];
  return `<div class="row ${on?'done':''} ${notDue?'notdue':''}">
    ${notDue?`<button class="box on soft" data-act="toggleyear" data-id="${x.id}" data-k="${o.key}" aria-label="Mark done again this year">${I.check}</button>`
            :checkbox(on,'toggleyear','data-id="'+x.id+'" data-k="'+o.key+'"',x.title+(o.label?', '+o.label:''))}
    <button class="body" data-act="yeardetail" data-id="${x.id}">
      <div class="t">${esc(x.title)}</div>
      <div class="m">${meta.filter(Boolean).map(esc).join(' · ')}${S.logs.some(l=>l.refId===x.id)?`<span>${I.doc} logged</span>`:''}</div>
    </button>
    ${editing?`<button class="icb" data-act="edityear" data-id="${x.id}" aria-label="Edit">${I.pencil}</button>
    <button class="icb" data-act="delyear" data-id="${x.id}" aria-label="Remove">${I.trash}</button>`:''}
  </div>`;
}

/* Photos grouped by the spot they were taken, newest spot first; unlabelled ones on top so they get named. */
function photoGroups(){
  const map=new Map();
  for(const p of S.photos){
    const key=(p.where||'').trim().toLowerCase();
    if(!map.has(key)) map.set(key,{key,name:(p.where||'').trim(),photos:[]});
    map.get(key).photos.push(p);
  }
  const gs=[...map.values()];
  gs.sort((a,b)=>(a.key?1:0)-(b.key?1:0)||(b.photos[0].addedAt>a.photos[0].addedAt?1:-1));
  return gs;
}
function photosAt(key){ return S.photos.filter(p=>(p.where||'').trim().toLowerCase()===key).slice().reverse(); } // oldest first
function fmtDate(s){
  const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(s||''); if(!m) return s||'';
  return `${MONTHS[+m[2]-1].slice(0,3)} ${+m[3]}, ${m[1]}`;
}

/* ---------- Budget ---------- */
const num=v=>{ const n=parseFloat(String(v??'').replace(/[^0-9.\-]/g,'')); return isNaN(n)?0:n; };
const money=n=>'$'+(Math.round(n*100)/100).toLocaleString(undefined,{maximumFractionDigits:2});
const yearOf=d=>+String(d||'').slice(0,4);
function lineSpent(l,y){
  const e=(l.entries||[]).filter(x=>yearOf(x.date)===y).reduce((s,x)=>s+num(x.amount),0);
  const b=(S.buy||[]).filter(x=>x.lineId===l.id&&x.bought&&yearOf(x.bought)===y).reduce((s,x)=>s+num(x.paid||x.est),0);
  const f=(S.fuel||[]).filter(x=>x.lineId===l.id&&yearOf(x.date)===y).reduce((s,x)=>s+fuelCost(x),0);
  return e+b+f;
}
const logSpent=y=>S.logs.filter(l=>yearOf(l.date)===y).reduce((s,l)=>s+num(l.cost),0);
const fuelCost=f=>num(f.total)||num(f.gallons)*num(f.price);
const unassignedFuel=y=>(S.fuel||[]).filter(x=>!x.lineId&&yearOf(x.date)===y).reduce((s,x)=>s+fuelCost(x),0);
const unassignedBuys=y=>(S.buy||[]).filter(x=>!x.lineId&&x.bought&&yearOf(x.bought)===y).reduce((s,x)=>s+num(x.paid||x.est),0);
function budgetYears(){
  const set=new Set(yearsTouched());
  (S.budget||[]).forEach(l=>(l.entries||[]).forEach(e=>set.add(yearOf(e.date))));
  (S.buy||[]).forEach(b=>{ if(b.bought) set.add(yearOf(b.bought)); });
  (S.fuel||[]).forEach(f=>set.add(yearOf(f.date)));
  (S.readings||[]).forEach(r=>set.add(yearOf(r.date)));
  return [...set].filter(Boolean).sort((a,b)=>a-b);
}
function bar(spent,planned){
  const pct=planned>0?Math.min(100,Math.round(spent/planned*100)):0, over=planned>0&&spent>planned;
  return `<div class="bar"><i style="width:${pct}%" class="${over?'over':''}"></i></div>`;
}

/* ---------- Numbers: readings and fuel ---------- */
const METRIC_HINTS=['Well bacteria (coliform)','Well nitrate (mg/L)','Pressure tank PSI','Pump cycle (seconds)',
  'Fuel tank (%)','Softener salt (%)','Radon (pCi/L)','Water hardness (gpg)','Attic insulation (inches)'];
const isNum=v=>String(v).trim()!==''&&!isNaN(parseFloat(String(v).replace(/[^0-9.\-]/g,'')))&&/[0-9]/.test(String(v));
function readingGroups(){
  const map=new Map();
  for(const r of (S.readings||[])){
    const key=(r.metric||'').trim().toLowerCase()||'unnamed';
    if(!map.has(key)) map.set(key,{key,name:(r.metric||'').trim()||'Unnamed',rows:[]});
    map.get(key).rows.push(r);
  }
  return [...map.values()]
    .map(g=>({...g,rows:g.rows.slice().sort((a,b)=>(b.date||'').localeCompare(a.date||''))}))
    .sort((a,b)=>a.name.localeCompare(b.name));
}
const points=rows=>rows.filter(r=>isNum(r.value)).map(r=>({x:+(parseDate(r.date)||0),y:num(r.value)}))
  .filter(p=>p.x).sort((a,b)=>a.x-b.x);
/* A plain line. Flat is the answer you want; a slope is the one you act on. */
function spark(vals){
  if(vals.length<2) return '';
  const w=300,h=60,pad=6;
  const xs=vals.map(v=>v.x), ys=vals.map(v=>v.y);
  const x0=Math.min(...xs), x1=Math.max(...xs), y0=Math.min(...ys), y1=Math.max(...ys);
  const sx=v=>pad+(x1===x0?0:(v-x0)/(x1-x0))*(w-2*pad);
  const sy=v=>y1===y0?h/2:h-pad-((v-y0)/(y1-y0))*(h-2*pad);
  const pts=vals.map(v=>`${sx(v.x).toFixed(1)},${sy(v.y).toFixed(1)}`).join(' ');
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" role="img" aria-label="trend">
    <polyline points="${pts}" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    ${vals.map(v=>`<circle cx="${sx(v.x).toFixed(1)}" cy="${sy(v.y).toFixed(1)}" r="2.6" fill="currentColor"/>`).join('')}
  </svg>`;
}
function trendLine(pts){
  if(pts.length<2) return '';
  const a=pts[0], b=pts[pts.length-1], diff=b.y-a.y;
  if(!diff) return 'Level across '+pts.length+' readings.';
  const years=Math.max(0.1,(b.x-a.x)/(365*DAY));
  const dir=diff>0?'up':'down';
  return `${dir} ${Math.abs(+diff.toFixed(2))} across ${pts.length} readings, about ${Math.round(years*10)/10} year${years>=1.5?'s':''}.`;
}
function fuelYear(y){
  const rows=(S.fuel||[]).filter(f=>yearOf(f.date)===y).sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  const gal=rows.reduce((s,f)=>s+num(f.gallons),0);
  const cost=rows.reduce((s,f)=>s+fuelCost(f),0);
  return {rows,gal,cost,avg:gal?cost/gal:0};
}
function numbersHTML(y){
  const groups=readingGroups();
  const f=fuelYear(y), p=fuelYear(y-1);
  return `<h2 class="sec">Readings</h2>
  <p class="hint">Numbers you take again and again. One on its own says very little; the line across years is the whole point.</p>

    return `<div class="card">
      <button class="head" data-act="metric" data-v="${esc(g.key)}">
        <div style="min-width:0;text-align:left">
          <b>${esc(g.name)}</b>

        </div>

      </button>
      ${pts.length>1?`<div class="inner" style="padding-top:0">${spark(pts)}<div class="trend">${esc(trendLine(pts))}</div></div>`:''}
    </div>`; }).join('')}
  ${groups.length?'':'<p class="hint" style="margin-bottom:10px">Nothing yet. The well test, the pressure tank, the softener — anything you will measure again.</p>'}
  <div class="btns h"><button class="btn dash" data-act="newreading">${I.plus} Add a reading</button>
    ${(S.readings||[]).length?`<button class="btn" data-act="csv" data-v="readings">${I.grid} Copy for a spreadsheet</button>`:''}</div>

  <h2 class="sec">Fuel</h2>

  <div class="card"><div class="inner" style="padding-top:14px">
    <div style="display:flex;justify-content:space-between;align-items:baseline">
      <span class="bignum">${f.gal?'$'+f.avg.toFixed(2):'—'}<small>${f.gal?'a gallon in '+y:'nothing logged in '+y}</small></span>
      <span class="hint" style="margin:0">${f.gal?Math.round(f.gal)+' gal · '+money(f.cost):''}</span>
    </div>
    ${p.gal&&f.gal?`<p class="trend" style="margin:8px 0 0">${y-1} came in at $${p.avg.toFixed(2)} a gallon — ${
      f.avg===p.avg?'the same':(f.avg>p.avg?'up ':'down ')+'$'+Math.abs(f.avg-p.avg).toFixed(2)}.</p>`:''}

const VIEWS={list:viewList,seasons:viewSeasons,photos:viewPhotos,gear:viewGear,budget:viewBudget,house:viewHouse,settings:viewSettings};
let prevTab='seasons';
const TABS=[['list','Setup',I.list],['seasons','Seasons',I.cal],['photos','Photos',I.cam],['gear','Systems',I.wrench],['budget','Budget',I.coin],['house','House',I.home]];
const visibleTabs=()=>TABS.filter(([k])=>k!=='list'||setupOpen());

function render(){
  if(!VIEWS[tab]||(tab==='list'&&!setupOpen())) tab='seasons';
  applyTheme(); renderHeader();
  const searching=q.trim()&&(tab==='list'||tab==='seasons');
  setHTML(document.getElementById('view'),searching?viewSearch():VIEWS[tab]());
  document.getElementById('nav').innerHTML=visibleTabs().map(([k,l,ic])=>
    `<button class="${tab===k?'on':''}" data-act="tab" data-v="${k}" ${tab===k?'aria-current="page"':''}>${ic}${l}</button>`).join('');
  setHTML(document.getElementById('modal'),modal?modalHTML():'');
  if(modal&&(modal.kind==='fileview'||modal.kind==='handoff')) mountViewer();
  // lazy-load any photos on screen
  const small=[...document.querySelectorAll('[data-act="viewphoto"]')].map(b=>b.dataset.id);
  const big=[...document.querySelectorAll('[data-act="viewfull"]')].map(b=>b.dataset.id);
  Promise.all([loadThumbs(small),loadPhotos(big)]).then(([a,b])=>{ if(a||b) render(); });
}

      <label class="lbl">Look at this again<select data-act="precheck" data-id="${p.id}">
        ${[[0,'No reminder'],[3,'In 3 months'],[6,'In 6 months'],[12,'In a year'],[24,'In two years']]
          .map(([n,lab])=>`<option value="${n}" ${(+p.recheckEvery||0)===n?'selected':''}>${lab}</option>`).join('')}
      </select></label>
      ${p.recheck?`<p class="hint" style="margin:0">Due for another look ${esc(fmtDate(p.recheck))} — ${esc(countdown(parseDate(p.recheck)))}.</p>`:''}
      ${list.length>1?`<button class="btn" data-act="compare" data-v="${esc(key)}">${I.grid} Put it beside another day</button>`:''}
      <button class="btn danger" data-act="delphoto" data-id="${p.id}">${I.trash} Delete this photo</button>`,true);
  }
  if(modal.kind==='handoff'){
    return `<div class="fv">
      <div class="bar">
        <button class="icb" data-act="closemodal" aria-label="Close">${I.x}</button>
        <div class="nm">Handoff pack</div>
        <button class="icb" data-act="handoffsave" aria-label="Save the page">${I.save}</button>
        <button class="icb" data-act="handoffprint" aria-label="Print or save as PDF">${I.paper}</button>
      </div>
      <div class="stage" id="fv"></div>
    </div>`;
  }
  if(modal.kind==='fileview'){
    const f=S.files.find(x=>x.id===modal.id)||{name:'File'};
    return `<div class="fv">
      <div class="bar">
        <button class="icb" data-act="closemodal" aria-label="Close">${I.x}</button>
        <div class="nm">${esc(f.name||'File')}</div>
        <button class="icb" data-act="fileout" data-id="${modal.id}" aria-label="Open in another app">${I.link}</button>
      </div>
      <div class="stage" id="fv"></div>
    </div>`;
  }
  if(modal.kind==='compare'){
    const list=photosAt(modal.key); if(list.length<2) return '';
    const pane=(side)=>{ const i=modal[side], p=list[i]; return `<div class="pane">
        <img src="${photoCache[p.id]||''}" alt="">
        <div class="cap"><button data-act="cmpstep" data-side="${side}" data-d="-1" ${i<=0?'disabled':''} aria-label="Earlier">${I.left}</button>
          <span>${esc(fmtDate(p.addedAt))}${p.caption?' · '+esc(p.caption):''}</span>
          <button data-act="cmpstep" data-side="${side}" data-d="1" ${i>=list.length-1?'disabled':''} aria-label="Later">${I.right}</button></div>
      </div>`; };
    return `<div class="viewer cmp" data-act="scrim">${pane('a')}${pane('b')}
      <button class="icb cmpx" data-act="closemodal" aria-label="Close">${I.x}</button></div>`;
  }
  if(modal.kind==='photo'){
    return `<div class="viewer" data-act="scrim"><img src="${photoCache[modal.id]||''}" alt=""></div>`;
  }
  return '';
}
function sheet(title,inner,auto){
  return `<div class="scrim" data-act="scrim"><div class="sheet">
    <div class="top"><div><h3>${esc(title)}</h3>${auto?'<div class="auto">Saves as you type</div>':''}</div>
      <button class="icb" data-act="closemodal" aria-label="Close">${I.x}</button></div>
    <div class="fields">${inner}</div></div></div>`;
}

/* Sheets save as you type. A brand-new item is created as soon as it has something in it. */
function commitDraft(){
  if(!modal||!modal.draft) return;
  const d=modal.draft;
  if(modal.kind==='task'){
    const has=(d.title||'').trim()||(d.notes||'').trim()||(d.photos&&d.photos.length);
    const rec={...d,photos:[...(d.photos||[])]};
    const i=S.tasks.findIndex(x=>x.id===d.id);
    if(i>=0) S.tasks[i]=rec; else if(has) S.tasks.push(rec); else return;
  }else if(modal.kind==='yearitem'){
    if(!(d.title||'').trim()) return;
    const rec={...d,month:+d.month||0,season:d.season||seasonOf(+d.month||1)};
    const i=S.yearly.findIndex(x=>x.id===d.id);
    if(i>=0) S.yearly[i]=rec; else S.yearly.push(rec);
  }else if(modal.kind==='lineedit'){
    if(!(d.name||'').trim()) return;
    const i=S.budget.findIndex(x=>x.id===d.id);
    if(i>=0) S.budget[i]={...S.budget[i],name:d.name,planned:num(d.planned)};
    else S.budget.push({id:d.id,name:d.name,planned:num(d.planned),entries:[]});
  }else if(modal.kind==='spend'){
    if(!(num(d.amount)>0)) return;
    const l=S.budget.find(x=>x.id===d.lineId); if(!l) return;
    l.entries=l.entries||[];
    const rec={id:d.id,date:d.date,amount:num(d.amount),note:d.note||''};
    const i=l.entries.findIndex(e=>e.id===d.id);
    if(i>=0) l.entries[i]=rec; else l.entries.push(rec);
  }else if(modal.kind==='buyedit'){
    if(!(d.title||'').trim()) return;
    const rec={id:d.id,title:d.title,est:num(d.est),note:d.note||'',url:d.url||'',lineId:d.lineId||'',bought:d.bought||null,paid:num(d.paid)};
    const i=S.buy.findIndex(x=>x.id===d.id);
    if(i>=0) S.buy[i]={...S.buy[i],...rec}; else S.buy.push(rec);
  }else if(modal.kind==='fileedit'){
    const i=S.files.findIndex(x=>x.id===d.id);
    if(!d.stored&&!(d.url||'').trim()&&!(d.name||'').trim()){ if(i>=0) S.files.splice(i,1); return; }
    const url=fixURL(d.url);
    const rec={...d,url,name:(d.name||'').trim()||url.replace(/^https?:\/\//,'').split('/')[0]||'Untitled'};
    if(i>=0) S.files[i]=rec; else S.files.unshift(rec);
  }else if(modal.kind==='reading'){
    if(!(d.metric||'').trim()||String(d.value).trim()==='') return;
    const rec={id:d.id,metric:d.metric,value:d.value,unit:d.unit||'',date:d.date||'',note:d.note||'',at:d.at||Date.now(),by:d.by||pref.who()};
    const i=S.readings.findIndex(x=>x.id===d.id);
    if(i>=0) S.readings[i]={...S.readings[i],...rec}; else S.readings.push(rec);
  }else if(modal.kind==='fuel'){
    if(!(num(d.gallons)>0||num(d.total)>0)) return;
    const rec={id:d.id,date:d.date||'',gallons:num(d.gallons),price:num(d.price),
      total:num(d.total)||+(num(d.gallons)*num(d.price)).toFixed(2),
      vendor:d.vendor||'',lineId:d.lineId||'',note:d.note||'',at:d.at||Date.now(),by:d.by||pref.who()};
    const i=S.fuel.findIndex(x=>x.id===d.id);
    if(i>=0) S.fuel[i]={...S.fuel[i],...rec}; else S.fuel.push(rec);
  }else if(modal.kind==='keydate'){
    if(!(d.title||'').trim()) return;
    const rec={id:d.id,title:d.title,date:d.date||'',every:+d.every||0,note:d.note||'',at:d.date?(d.at||Date.now()):0,by:d.by||pref.who()};
    const i=S.keyDates.findIndex(x=>x.id===d.id);
    if(i>=0) S.keyDates[i]={...S.keyDates[i],...rec}; else S.keyDates.push(rec);
  }else if(modal.kind==='contact'){
    const has=(d.name||'').trim()||(d.phone||'').trim()||(d.url||'').trim();
    const rec={...d,url:fixURL(d.url)};
    const i=S.contacts.findIndex(x=>x.id===d.id);
    if(i>=0) S.contacts[i]=rec; else if(has) S.contacts.push(rec); else return;
  }else if(modal.kind==='log'){
    const has=(d.what||'').trim()||(d.who||'').trim()||(d.cost||'').trim()||(d.doc||'').trim()||(d.photos&&d.photos.length);
    const rec={id:d.id,refId:d.refId,subject:d.subject,what:d.what,who:d.who,cost:d.cost,doc:d.doc,
      photos:[...(d.photos||[])],date:((d.date||'')+' '+(d.time||'')).trim(),at:d.at||Date.now()};
    const i=S.logs.findIndex(x=>x.id===d.id);
    if(i>=0) S.logs[i]=rec; else if(has) S.logs.unshift(rec); else return;
  }else return;
  saveSoon();
}
function closeModal(){
  if(modal&&(modal.kind==='fileview'||modal.kind==='photo')) fvRevoke();
  if(modal&&(modal.kind==='welcome'||modal.kind==='connect')&&!cloud.code){
    if(modal.who!==undefined) LS('hq:who',(modal.who||'').trim()||null);
    if(modal.kind==='welcome'&&(modal.pname||'').trim()) S.propertyName=modal.pname.trim();
    LS('hq:nocloud','1'); if(modal.kind==='welcome') save();
  }
  if(modal&&modal.draft){
    commitDraft();
    if(modal.kind==='yearitem'&&(modal.draft.title||'').trim()) seasonSel=modal.draft.season;
  }
  modal=null; flushSave();
  if(pendingRender){ pendingRender=false; }
}
